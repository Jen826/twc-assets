async function decodePhoto(f){
  if(typeof jsQR!=="function"){toast("The QR reader didn't load. Type the tag instead.");return null}
  try{
    const img=await createImageBitmap(f);const scale=Math.min(1,1600/Math.max(img.width,img.height));
    const c=document.createElement("canvas");c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);
    const ctx=c.getContext("2d");ctx.drawImage(img,0,0,c.width,c.height);
    const d=ctx.getImageData(0,0,c.width,c.height);const r=jsQR(d.data,c.width,c.height,{inversionAttempts:"attemptBoth"});
    if(!r){toast("No QR code found. Try again closer and in good light, or type the tag.");return null}
    return parseScan(r.data);
  }catch(err){toast("Couldn't read that photo");return null}
}
/* ---------- Live camera scanner ---------- */
const Scanner=(()=>{
  let el,video,canvas,ctx,stream,timer,detector=null,detectorTried=false,opts={},last={code:"",at:0},busy=false,running=false,torchOn=false;
  const $c=id=>el.querySelector(id);
  function ui(){
    if(el) return;
    el=document.createElement("div");el.id="cam";el.hidden=true;el.setAttribute("role","dialog");el.setAttribute("aria-label","Camera scanner");
    el.innerHTML=`<video playsinline muted autoplay></video><div class="cam-frame" aria-hidden="true"><i></i></div>
      <div class="cam-top"><span id="camTitle"></span></div>
      <div class="cam-bottom"><div id="camMsg" aria-live="polite"></div>
        <div class="cam-btns"><button type="button" class="btn" id="camTorch" hidden>Light</button><button type="button" class="btn" id="camClose">Done</button></div></div>`;
    document.body.appendChild(el);
    video=el.querySelector("video");canvas=document.createElement("canvas");ctx=canvas.getContext("2d",{willReadFrequently:true});
    $c("#camClose").onclick=close;$c("#camTorch").onclick=toggleTorch;
    document.addEventListener("keydown",e=>{if(e.key==="Escape"&&running) close()});
  }
  function msg(t,bad){$c("#camMsg").textContent=t||"";el.classList.toggle("err",!!bad)}
  async function open(o){
    opts=o||{};ui();last={code:"",at:0};busy=false;torchOn=false;
    el.hidden=false;$c("#camTitle").textContent=opts.title||"Point the camera at a QR label";msg(opts.hint||"");$c("#camTorch").hidden=true;
    if(!window.isSecureContext||!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
      msg("This browser can't open the camera here. Use the camera-icon Photo button instead.",true);return}
    try{stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:"environment"},width:{ideal:1280},height:{ideal:720}}})}
    catch(e){
      const n=e&&e.name;
      msg(n==="NotAllowedError"||n==="SecurityError"?"Camera access is blocked. Allow the camera for this site (tap the icon next to the address bar, or check your phone's browser settings), then tap Scan again."
        :n==="NotFoundError"||n==="OverconstrainedError"?"No camera was found on this device. Use the Photo button or type the tag."
        :"The camera couldn't be opened"+(n?" ("+n+")":"")+". Close other apps using the camera and try again.",true);
      return}
    if(el.hidden){stop();return}
    video.srcObject=stream;try{await video.play()}catch(e){}
    try{const tr=stream.getVideoTracks()[0],caps=tr.getCapabilities&&tr.getCapabilities();$c("#camTorch").hidden=!(caps&&caps.torch)}catch(e){}
    if(!detectorTried){detectorTried=true;
      try{if("BarcodeDetector" in window&&(await BarcodeDetector.getSupportedFormats()).includes("qr_code")) detector=new BarcodeDetector({formats:["qr_code"]})}catch(e){detector=null}}
    running=true;tick();
  }
  async function readFrame(){
    if(video.readyState<2||!video.videoWidth) return null;
    if(detector){try{const r=await detector.detect(video);return r&&r.length?r[0].rawValue:null}catch(e){detector=null}}
    if(typeof jsQR!=="function") return null;
    const w=video.videoWidth,h=video.videoHeight,sc=Math.min(1,720/Math.max(w,h));
    canvas.width=Math.round(w*sc);canvas.height=Math.round(h*sc);
    ctx.drawImage(video,0,0,canvas.width,canvas.height);
    const img=ctx.getImageData(0,0,canvas.width,canvas.height),r=jsQR(img.data,img.width,img.height,{inversionAttempts:"dontInvert"});
    return r?r.data:null;
  }
  async function tick(){
    if(!running) return;
    if(!busy){let raw=null;try{raw=await readFrame()}catch(e){}if(raw&&running) await found(raw)}
    if(running) timer=setTimeout(tick,110);
  }
  async function found(raw){
    const code=parseScan(raw);
    if(!code||!/^[A-Z0-9][A-Z0-9-]{1,79}$/.test(code)){
      if(Date.now()-last.at>2500){last={code:"",at:Date.now()};msg("That code isn't one of our asset labels.",true)}return}
    const now=Date.now();if(code===last.code&&now-last.at<3000) return;
    last={code,at:now};
    try{navigator.vibrate&&navigator.vibrate(70)}catch(e){}
    el.classList.add("hit");setTimeout(()=>el&&el.classList.remove("hit"),400);
    if(!opts.continuous){const cb=opts.onCode;close();if(cb) cb(code);return}
    busy=true;msg(code+" …");
    try{const r=await opts.onCode(code);if(r&&typeof r==="object") msg(r.text,r.bad);else msg(r||code)}
    catch(e){msg("Couldn't record "+code+": "+(e&&e.message||e),true)}
    finally{busy=false;last.at=Date.now()}
  }
  async function toggleTorch(){
    try{const tr=stream&&stream.getVideoTracks()[0];if(!tr) return;torchOn=!torchOn;await tr.applyConstraints({advanced:[{torch:torchOn}]});$c("#camTorch").textContent=torchOn?"Light off":"Light"}catch(e){}
  }
  function stop(){running=false;clearTimeout(timer);if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}if(video) video.srcObject=null}
  function close(){stop();if(el) el.hidden=true;const cb=opts.onClose;opts={};if(cb) cb()}
  return {open,close,isOpen:()=>!!el&&!el.hidden};
})();

function openStocktake(){
  const unit=S.unit,u=S.units.find(x=>x.code===unit)||{code:unit,name:unit};
  const st={found:new Set(),entries:[],busy:false,info:{},moved:new Set(),marked:[],started:Date.now(),id:"ST-"+localDay().replace(/-/g,"")+"-"+Date.now().toString(36).slice(-5).toUpperCase(),saving:Promise.resolve()};
  const stRecord=()=>{const act=active(),tags=[...st.found],uniq=f=>[...new Set(st.entries.filter(f).map(e=>e.tag))];
    return {id:st.id,unit,date:localDay(),startedAt:st.started,finishedAt:st.done?Date.now():null,status:st.done?"Completed":"In progress",by:S.me||null,total:act.length,
      found:act.filter(a=>st.found.has(a.tag)).map(a=>a.tag),
      missing:act.filter(a=>!st.found.has(a.tag)).map(a=>({tag:a.tag,name:a.name||"",location:a.location||"",lastVerified:a.verifiedAt||null})),
      wrongUnit:tags.filter(t=>st.info[t]&&st.info[t].unit!==unit).map(t=>({tag:t,name:st.info[t].name,from:st.info[t].unit,moved:st.moved.has(t)})),
      notInRegister:uniq(e=>/not in the register/.test(e.text)),disposedLabels:uniq(e=>/was disposed/.test(e.text)),markedMissing:st.marked,note:st.note||""}};
  const persist=()=>{if(!st.entries.length) return st.saving;const rec=stRecord();st.saving=st.saving.then(()=>S.db.doc("stocktakes/"+st.id).set(rec)).catch(e=>console.warn("stocktake save",e));return st.saving};
  const active=()=>S.assets.filter(a=>a.unit===unit&&a.status!=="Disposed");
  modal(`<h3>Stocktake · ${esc(unitLabel(unit))}</h3>
   <p class="hint" style="margin:0">Walk the floor and scan each label. Every scan marks that item as verified today. Tap <b>Scan with camera</b> and sweep the room, or use a handheld scanner: the box stays ready.</p>
   <div class="st-count"><div><span class="big" id="stN">0</span> <span class="muted">of <span id="stT">0</span> found</span></div><span class="muted num" id="stPct">0%</span></div>
   <div class="meter"><i id="stBar" style="width:0%"></i></div>
   <form class="st-scan" id="stForm" autocomplete="off"><input id="stInput" placeholder="Scan or type tag" aria-label="Asset tag" enterkeyhint="go">
     <label class="btn">Photo<input type="file" id="stPhoto" accept="image/\x2a" capture="environment" hidden></label>
     <button type="button" class="btn primary st-cambtn" id="stCam">Scan with camera</button></form>
   <ul class="log st-log" id="stList"></ul>
   <details class="notfound" id="stMissing"><summary>Not found yet (<span id="stMC">0</span>)</summary><ul id="stML"></ul>
     <button class="btn danger" data-write id="stMark" type="button">Mark these as Missing</button></details>
   <div class="row-end"><button class="btn primary" type="button" id="stDone">Finish stocktake</button></div>`);
  const input=$("#stInput");input.focus();
  function draw(){
    const act=active(),n=act.filter(a=>st.found.has(a.tag)).length,t=act.length,pct=t?Math.round(n/t*100):0;
    $("#stN").textContent=n;$("#stT").textContent=t;$("#stPct").textContent=pct+"%";$("#stBar").style.width=pct+"%";
    $("#stList").innerHTML=st.entries.slice(0,30).map(e=>`<li><time>${e.time}</time><span><span class="res ${e.cls}">${esc(e.tag)}</span> ${esc(e.text)}${e.moveFrom&&S.canWrite?` <button type="button" class="btn st-move" data-move="${esc(e.tag)}">Move to ${esc((S.units.find(x=>x.code===unit)||{}).name||unit)}</button>`:""}</span></li>`).join("");
    const miss=act.filter(a=>!st.found.has(a.tag));
    $("#stMC").textContent=miss.length;
    $("#stML").innerHTML=miss.map(a=>`<li><span class="tagchip">${esc(a.tag)}</span> ${esc(a.name)} <span class="muted">· ${esc(a.location||"no location")}</span></li>`).join("")||`<li class="muted">Everything has been found.</li>`;
    const mb=$("#stMark");mb.hidden=!miss.length||!S.canWrite||!st.entries.length;mb.dataset.armed="";mb.textContent=`Mark these ${miss.length} as Missing`;
  }
  async function scan(raw){
    const tag=parseScan(raw);if(!tag||st.busy) return;st.busy=true;
    const time=new Date().toLocaleTimeString(undefined,{hour:"2-digit",minute:"2-digit"});
    try{
      if(st.found.has(tag)){st.entries.unshift({time,tag,cls:"warn",text:"already scanned"});return}
      const snap=await S.db.doc("assets/"+tag).get();
      if(!snap.exists){st.entries.unshift({time,tag,cls:"bad",text:"is not in the register"});return}
      const a=snap.data();st.info[tag]={name:a.name||"",location:a.location||"",unit:a.unit};
      if(a.status==="Disposed"){st.entries.unshift({time,tag,cls:"bad",text:"was disposed"+(a.disposedOn?" on "+fmtDate(Date.parse(a.disposedOn+"T00:00:00")):"")+" · this label is deactivated, please remove it"});return}
      await S.db.doc("assets/"+tag).update({verifiedAt:Date.now(),verifiedBy:S.me||null,...(a.status==="Missing"?{status:"In use"}:{})});
      await logEvent(tag,`Verified in stocktake${a.status==="Missing"?" (was Missing)":""}`);
      st.found.add(tag);
      const notes=[a.name];
      if(a.unit!==unit) notes.push(`recorded in ${unitLabel(a.unit)}`);
      if(a.status==="Missing") notes.push("was marked Missing, now back In use");
      if(a.needsLabel) notes.push("label is on the reprint list");
      st.entries.unshift({time,tag,cls:a.unit!==unit?"warn":"ok",text:"found · "+notes.join(" · "),moveFrom:a.unit!==unit?a.unit:null});
    }catch(e){writeErr(e)}
    finally{st.busy=false;draw();persist();input.value="";if(!Scanner.isOpen()) input.focus()}
  }
  $("#stForm").onsubmit=e=>{e.preventDefault();scan(input.value)};
  $("#stList").addEventListener("click",async e=>{const b=e.target.closest("[data-move]");if(!b) return;b.disabled=true;b.textContent="Moving…";
    try{await transferItems([b.dataset.move],unit,"","Found here during stocktake");const en=st.entries.find(x=>x.tag===b.dataset.move);
      if(en){en.moveFrom=null;en.cls="ok";en.text+=` · moved to ${unitLabel(unit)}`}st.moved.add(b.dataset.move);persist();toast(`${b.dataset.move} moved here`)}catch(err){writeErr(err)}
    draw();input.focus()});
  $("#stCam").onclick=()=>Scanner.open({continuous:true,title:"Stocktake · "+unitLabel(unit),hint:"Scan each label. Found items are ticked off as you go.",
    onCode:async tag=>{await scan(tag);const e=st.entries[0],n=active().filter(a=>st.found.has(a.tag)).length;
      return {text:(e?`${e.tag} ${e.text}`:tag)+`\n${n} of ${active().length} found`,bad:e&&e.cls==="bad"}}});
  $("#stPhoto").onchange=async e=>{const f=e.target.files[0];e.target.value="";if(!f) return;toast("Reading QR code…");const t=await decodePhoto(f);if(t){$("#toast").hidden=true;scan(t)}};
  $("#stDone").onclick=async()=>{
    if(!st.entries.length){closeOverlay();return}
    const b=$("#stDone");b.disabled=true;b.textContent="Saving…";st.done=true;
    try{if(window.Scanner&&Scanner.isOpen()) Scanner.close()}catch(e){}
    await persist();openStocktakeRecord(stRecord());
  };
  $("#stMark").onclick=async e=>{
    const b=e.currentTarget,miss=active().filter(a=>!st.found.has(a.tag));
    if(!b.dataset.armed){b.dataset.armed="1";b.textContent=`Confirm: mark ${miss.length} as Missing`;return}
    b.disabled=true;
    try{for(const a of miss){if(a.status==="Missing") continue;await S.db.doc("assets/"+a.tag).update({status:"Missing",updatedAt:Date.now(),updatedBy:S.me||null});await logEvent(a.tag,`Status ${a.status} → Missing (not found in stocktake)`)}
      st.marked=[...new Set([...st.marked,...miss.map(a=>a.tag)])];persist();toast(`${miss.length} marked Missing`)}catch(err){writeErr(err)}
    b.disabled=false;draw();
  };
  draw();
}

/* ---------- Stocktake records & report ---------- */
const whoName=id=>id?(String(id).startsWith("n:")?String(id).slice(2)||"Unknown":nameOf(id)):"";
const xlDate=ms=>new Date(ms-new Date(ms).getTimezoneOffset()*60000);
const fmtTime=ms=>ms?new Date(ms).toLocaleTimeString(undefined,{hour:"2-digit",minute:"2-digit"}):"";
function stSummary(r){return {total:r.total||0,found:(r.found||[]).length,missing:(r.missing||[]).length,wrong:(r.wrongUnit||[]).filter(x=>!x.moved).length,
  moved:(r.wrongUnit||[]).filter(x=>x.moved).length,unknown:(r.notInRegister||[]).length+(r.disposedLabels||[]).length}}
const stItemName=t=>{const a=(S.assets||[]).find(x=>x.tag===t)||(S.itemsByTag||{})[t];return a?a.name:""};
function openStocktakeRecord(r){
  const s=stSummary(r),pct=s.total?Math.round(s.found/s.total*100):0;
  const li=(arr,f)=>arr.map(f).join("");
  modal(`<h3>Stocktake · ${esc(unitLabel(r.unit))}</h3>
   <p class="muted" style="margin:0;font-size:14px">${esc(fmtDate(r.startedAt))} · ${esc(fmtTime(r.startedAt))}${r.finishedAt?"–"+esc(fmtTime(r.finishedAt)):""} · by ${esc(whoName(r.by))}${r.status==="Completed"?"":` · <span class="stale">Not finished</span>`}</p>
   <div class="st-sum"><div><b class="num">${s.found}<small> / ${s.total}</small></b><span>Found (${pct}%)</span></div><div class="${s.missing?"bad":""}"><b class="num">${s.missing}</b><span>Missing</span></div>
     <div class="${s.wrong?"warn":""}"><b class="num">${s.wrong+s.moved}</b><span>From other units${s.moved?` (${s.moved} moved here)`:""}</span></div><div class="${s.unknown?"warn":""}"><b class="num">${s.unknown}</b><span>Unknown or disposed labels</span></div></div>
   ${s.missing?`<div><span class="eyebrow">Missing</span><ul class="report-list">${li(r.missing,m=>`<li><span class="tagchip">${esc(m.tag)}</span> ${esc(m.name)} <span class="muted">· ${esc(m.location||"no location")}${(r.markedMissing||[]).includes(m.tag)?" · marked Missing":""}</span></li>`)}</ul></div>`:""}
   ${(r.wrongUnit||[]).length?`<div><span class="eyebrow">Found here but recorded in another unit</span><ul class="report-list">${li(r.wrongUnit,w=>`<li><span class="tagchip">${esc(w.tag)}</span> ${esc(w.name)} <span class="muted">· recorded in ${esc(unitLabel(w.from))}${w.moved?" · moved here":""}</span></li>`)}</ul></div>`:""}
   ${(r.notInRegister||[]).length||(r.disposedLabels||[]).length?`<div><span class="eyebrow">Labels that need attention</span><ul class="report-list">${li(r.notInRegister||[],t=>`<li><span class="tagchip">${esc(t)}</span> <span class="muted">not in the register</span></li>`)}${li(r.disposedLabels||[],t=>`<li><span class="tagchip">${esc(t)}</span> <span class="muted">disposed item, label should be removed</span></li>`)}</ul></div>`:""}
   ${s.found?`<details class="notfound"><summary>Found (${s.found})</summary><ul class="report-list">${li(r.found,t=>`<li><span class="tagchip">${esc(t)}</span> ${esc(stItemName(t))}</li>`)}</ul></details>`:""}
   <div class="field"><label for="stNote">Notes</label><input id="stNote" value="${esc(r.note||"")}" placeholder="e.g. Move-out check with tenant, 2 chairs taken by tenant"></div>
   <div class="row-end"><button class="btn" data-close>Close</button><button class="btn primary" id="stPrint">Download report</button></div>`);
  const note=$("#stNote");note.onchange=async()=>{r.note=note.value.trim().slice(0,1000);try{await S.db.doc("stocktakes/"+r.id).update({note:r.note});toast("Note saved")}catch(e){writeErr(e)}};
  $("#stPrint").onclick=async()=>{r.note=note.value.trim().slice(0,1000);if(!S.dl){toast("Downloads aren't available in this view");return}
    try{await S.dl.save({filename:`stocktake-${r.unit}-${String(r.date||localDay())}.html`,data:stocktakeReportHtml(r)})}catch(e){if(e.code!=="declined") toast("Couldn't download: "+e.message)}};
}

  const row=c=>`<tr>${c.map(x=>`<td>${x}</td>`).join("")}</tr>`;
  const table=(head,rows)=>rows.length?`<table><thead><tr>${head.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${rows.join("")}</tbody></table>`:`<p class="none">None</p>`;
  return `<!doctype html><html><head><meta charset="utf-8"><title>Stocktake report ${esc(unitLabel(r.unit))} ${esc(fmtDate(r.startedAt))}</title><style>
@page{size:A4;margin:14mm}body{font:11pt/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;color:#111;margin:0}
h1{font-size:18pt;margin:0 0 2mm}h2{font-size:12pt;margin:7mm 0 2mm;border-bottom:0.3mm solid #999;padding-bottom:1mm}
.meta{display:grid;grid-template-columns:38mm 1fr;gap:1mm 4mm;margin:4mm 0}.meta dt{color:#555}.meta dd{margin:0;font-weight:600}
.sum{display:grid;grid-template-columns:repeat(4,1fr);gap:3mm;margin:4mm 0}.sum div{border:0.3mm solid #bbb;border-radius:2mm;padding:3mm}.sum b{display:block;font-size:18pt}.sum .bad{border-color:#b0362f;color:#b0362f}
table{width:100%;border-collapse:collapse;font-size:10pt}th,td{text-align:left;padding:1.5mm 2mm;border-bottom:0.2mm solid #ccc;vertical-align:top}th{background:#f2f2f2}
.mono{font-family:Menlo,Consolas,monospace}.none{color:#666;margin:0}.note{white-space:pre-wrap}
.sign{display:grid;grid-template-columns:1fr 1fr;gap:12mm;margin-top:14mm}.sign div{border-top:0.3mm solid #333;padding-top:2mm;font-size:9.5pt;color:#333}
.tip{font:10pt system-ui;background:#fff6d6;padding:3mm;border-radius:2mm;margin-bottom:5mm}@media print{.tip{display:none}}
</style></head><body><p class="tip">Use your browser's Print (Ctrl+P / Share → Print) to print or save as PDF.</p>
<h1>Stocktake report</h1><div>TWC · ${esc(propName(u.property))} · ${esc(u.name||r.unit)}</div>
<dl class="meta"><dt>Unit</dt><dd>${esc(unitLabel(r.unit))} (${esc(r.unit)})</dd><dt>Date</dt><dd>${esc(fmtDate(r.startedAt))}, ${esc(fmtTime(r.startedAt))}${r.finishedAt?" – "+esc(fmtTime(r.finishedAt)):""}</dd>
<dt>Conducted by</dt><dd>${esc(whoName(r.by))}</dd><dt>Status</dt><dd>${r.status==="Completed"?"Completed":"Not finished"}</dd><dt>Reference</dt><dd class="mono">${esc(r.id)}</dd>${r.note?`<dt>Notes</dt><dd class="note">${esc(r.note)}</dd>`:""}</dl>
<div class="sum"><div><b>${s.found} / ${s.total}</b>Found</div><div class="${s.missing?"bad":""}"><b>${s.missing}</b>Missing</div><div><b>${s.wrong+s.moved}</b>From other units</div><div><b>${s.unknown}</b>Unknown / disposed labels</div></div>
<h2>Missing items (${s.missing})</h2>${table(["Tag","Item","Recorded location","Last verified before"],(r.missing||[]).map(m=>row([`<span class="mono">${esc(m.tag)}</span>`,esc(m.name),esc(m.location||""),esc(m.lastVerified?fmtDate(m.lastVerified):"Never")])))}
<h2>Found here but recorded in another unit (${(r.wrongUnit||[]).length})</h2>${table(["Tag","Item","Recorded in","Action"],(r.wrongUnit||[]).map(w=>row([`<span class="mono">${esc(w.tag)}</span>`,esc(w.name),esc(unitLabel(w.from)),w.moved?"Moved to this unit":"Not moved"])))}
<h2>Labels that need attention (${(r.notInRegister||[]).length+(r.disposedLabels||[]).length})</h2>${table(["Label","Issue"],[...(r.notInRegister||[]).map(t=>row([`<span class="mono">${esc(t)}</span>`,"Not in the register"])),...(r.disposedLabels||[]).map(t=>row([`<span class="mono">${esc(t)}</span>`,"Item was disposed, remove the label"]))])}
<h2>Items found (${s.found})</h2>${table(["Tag","Item"],(r.found||[]).map(t=>row([`<span class="mono">${esc(t)}</span>`,esc(stItemName(t))])))}
<div class="sign"><div>Conducted by (name, signature, date)</div><div>Acknowledged by tenant / unit representative (name, signature, date)</div></div>
</body></html>`;
}
function renderUnitStocktakes(v,u){
  v.innerHTML=`<div class="pagehead"><div><button class="linkback" onclick="selectUnit('${u.property?"__prop:"+esc(u.property):""}')">← ${esc(propName(u.property))}</button><h2>${esc(u.name)}</h2><div class="sub"><span class="tagchip">${esc(u.code)}</span></div></div>
    <div class="actions"><button class="btn primary" data-write id="stStart2" ${S.assets.length?"":"disabled"}>Start stocktake</button></div></div>
    ${unitTabs()}<div id="stHist"><div class="empty"><h3>Loading stocktakes…</h3></div></div>`;
  wireUnitTabs();$("#stStart2").onclick=openStocktake;applyWriteGate();
  S.db.collection("stocktakes").where("unit","==",u.code).limit(500).get().then(sn=>{
    if(S.unit!==u.code||S.unitTab!=="stocktakes") return;const b=$("#stHist");if(!b) return;
    const rows=sn.docs.map(d=>d.data()).filter(r=>r&&r.id).sort((a,b)=>(b.startedAt||0)-(a.startedAt||0));S.stHist=rows;
    b.innerHTML=rows.length?`<div class="ledger-wrap"><table class="ledger"><thead><tr><th>Date</th><th>By</th><th style="text-align:right">Found</th><th style="text-align:right">Missing</th><th style="text-align:right">Other units</th><th>Status</th></tr></thead><tbody>
      ${rows.map(r=>{const s=stSummary(r);return `<tr data-st="${esc(r.id)}"><td class="num" style="white-space:nowrap">${esc(fmtDate(r.startedAt))} <span class="muted">${esc(fmtTime(r.startedAt))}</span></td><td>${esc(whoName(r.by))}</td>
        <td class="num mono" style="text-align:right">${s.found}/${s.total}</td><td class="num mono" style="text-align:right;${s.missing?"color:var(--bad);font-weight:700":""}">${s.missing}</td><td class="num mono" style="text-align:right">${s.wrong+s.moved||""}</td>
        <td>${r.status==="Completed"?`<span class="pill s-inuse"><span class="dot"></span>Completed</span>`:`<span class="pill s-repair"><span class="dot"></span>Not finished</span>`}</td></tr>`}).join("")}
      </tbody></table></div><p class="hint" style="margin:0">Tap a stocktake to see what was missing and download a printable report, for example for a tenant move-out.</p>`
      :`<div class="empty"><h3>No stocktakes yet</h3><p>Tap <b>Start stocktake</b> and scan every label in this unit. Each stocktake is saved here with what was found, missing or in the wrong unit, ready to print.</p></div>`;
    b.querySelector("tbody")?.addEventListener("click",e=>{const tr=e.target.closest("tr[data-st]");if(tr) openStocktakeRecord(rows.find(x=>x.id===tr.dataset.st))});
  }).catch(fail);
}

/* ---------- Move-in / move-out handovers ---------- */
const SIGN_PAGE="https://jen826.github.io/twc-assets/sign.html";
const HO_EXTRAS=["Door key","Access card","Locker key","Pedestal key","Aircon remote"];
const HO_CONDS=["New","Good","Fair","Poor","Damaged"];
const hoLink=h=>h&&h.token?(h.signPage||SIGN_PAGE)+"?h="+encodeURIComponent(h.token):"";
const hoDate=h=>h&&h.date?fmtDate(Date.parse(h.date+"T00:00:00")):"";
const hoStatusPill=s=>s==="Signed"?`<span class="pill s-inuse"><span class="dot"></span>Signed</span>`:s==="Sent"?`<span class="pill s-repair"><span class="dot"></span>Waiting for signature</span>`:`<span class="pill s-storage"><span class="dot"></span>Draft</span>`;
function hoList(unit){return S.db.collection("handovers").where("unit","==",unit).limit(500).get().then(sn=>sn.docs.map(d=>d.data()).filter(h=>h&&h.id)
  .sort((a,b)=>String(b.date||"").localeCompare(String(a.date||""))||(b.createdAt||0)-(a.createdAt||0)))}
function renderUnitHandovers(v,u){
  v.innerHTML=`<div class="pagehead"><div><button class="linkback" onclick="selectUnit('${u.property?"__prop:"+esc(u.property):""}')">← ${esc(propName(u.property))}</button><h2>${esc(u.name)}</h2><div class="sub"><span class="tagchip">${esc(u.code)}</span></div></div>
    <div class="actions"><button class="btn primary" data-write id="hoNewIn">+ Move-in handover</button><button class="btn" data-write id="hoNewOut">+ Move-out handover</button></div></div>
    ${unitTabs()}<div id="hoHist"><div class="empty"><h3>Loading handovers…</h3></div></div>`;
  wireUnitTabs();$("#hoNewIn").onclick=()=>newHandover(u.code,"Move-in");$("#hoNewOut").onclick=()=>newHandover(u.code,"Move-out");applyWriteGate();
  hoList(u.code).then(rows=>{if(S.unit!==u.code||S.unitTab!=="handovers"||S.view) return;const b=$("#hoHist");if(!b) return;
    b.innerHTML=rows.length?`<div class="ledger-wrap"><table class="ledger"><thead><tr><th>Date</th><th>Type</th><th>Tenant</th><th style="text-align:right">Items</th><th>Status</th></tr></thead><tbody>
      ${rows.map(h=>`<tr data-ho="${esc(h.id)}"><td class="num" style="white-space:nowrap">${esc(hoDate(h))}</td><td>${esc(h.type)}</td><td>${esc((h.tenant||{}).company||"")}<div class="muted" style="font-size:12.5px">${esc((h.tenant||{}).name||"")}</div></td>
        <td class="num mono" style="text-align:right">${(h.items||[]).filter(i=>i.included!==false).length+(h.extras||[]).length}</td><td>${hoStatusPill(h.status)}${h.status==="Signed"&&h.signedAt?`<div class="muted" style="font-size:12px">${esc(fmtDate(h.signedAt))}</div>`:""}</td></tr>`).join("")}
      </tbody></table></div>`
      :`<div class="empty"><h3>No handovers yet</h3><p>Create a move-in handover when a tenant takes this unit. It lists every item with its photo and condition, plus keys and access cards. Email it to the tenant to review and sign on their phone or computer.</p></div>`;
    b.querySelector("tbody")?.addEventListener("click",e=>{const tr=e.target.closest("tr[data-ho]");if(tr) openHandover(rows.find(x=>x.id===tr.dataset.ho))});
  }).catch(fail);
}
async function newHandover(unit,type){
  const items=S.assets.filter(a=>a.unit===unit&&a.status!=="Disposed").sort((a,b)=>a.tag.localeCompare(b.tag,undefined,{numeric:true})).map(a=>{const ap=assetPhotos(a);
    return {key:"t:"+a.tag,kind:"tag",tag:a.tag,name:a.name||"",qty:1,location:a.location||"",condition:HO_CONDS.includes(a.condition)?a.condition:"Good",note:"",photo:ap.ids[0]||"",photoFrom:ap.ids.length?(ap.own?"asset":"catalogue"):"",included:true}});
  try{(await computeStock()).filter(r=>r.unit===unit&&r.untagged>0).forEach(r=>{const p=prodById(r.pid)||{name:"(asset)",photos:[]};
    items.push({key:"s:"+r.pid,kind:"stock",pid:r.pid,name:p.name+(p.colour?` (${p.colour})`:""),qty:r.untagged,location:"",condition:"Good",note:"",photo:(p.photos||[])[0]||"",photoFrom:(p.photos||[]).length?"catalogue":"",included:true})})}catch(e){}

async function saveHandover(){
  const h=S.ho;if(!h) return false;
  if(h.status==="Signed"){toast("A signed handover can't be changed");return false}
  const now=Date.now();
  if(!h.id){h.id="HO-"+localDay().replace(/-/g,"")+"-"+now.toString(36).slice(-5).toUpperCase();h.createdAt=now;h.createdBy=S.me||null;h.staffName=whoName(S.me)}
  h.updatedAt=now;h.updatedBy=S.me||null;
  const rec=JSON.parse(JSON.stringify(h));
  if(JSON.stringify(rec).length>45000){toast("This handover is too long to save in one record. Split it into two handovers.");return false}
  try{await S.db.doc("handovers/"+h.id).set(rec);S.hoDirty=false;renderView();return true}catch(e){fail(e);return false}
}
function sendHandover(){
  const h=S.ho,em=String(h.tenant.email||"").trim();
  if(!String(h.tenant.name||"").trim()){toast("Enter the tenant's contact person");$("#ho-name")?.focus();return}
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){toast("Enter a valid email address for the tenant");$("#ho-email")?.focus();return}
  if(!window.twcCall){toast("Sending isn't available in this view");return}
  const n=h.items.filter(i=>i.included!==false).length+h.extras.length,np=hoPhotoIds(h).length;
  modal(`<h3>${h.status==="Sent"?"Resend":"Send"} the handover to ${esc(em)}?</h3>
   <p style="margin:0">${esc(h.tenant.name)} gets an email listing the ${n} item${n===1?"":"s"}${np?` with ${np} photo${np===1?"":"s"}`:""}, and a button to review and sign online. Once they sign, you both get a signed copy by email.</p>
   <div class="row-end"><button class="btn" data-close>Cancel</button><button class="btn primary" id="hsGo">Send email</button></div>`);
  $("#hsGo").onclick=async()=>{const b=$("#hsGo");b.disabled=true;b.textContent="Saving…";
    try{
      if(!(await saveHandover())){b.disabled=false;b.textContent="Send email";return}
      await window.twcFlush();b.textContent="Sending…";
      const r=await window.twcCall("apiHandoverSend",h.id,{signPage:SIGN_PAGE,by:whoName(S.me)});
      Object.assign(S.ho,r.record||{});S.hoDirty=false;closeOverlay();toast(`Sent to ${em}`);renderView();if(window.twcSync) window.twcSync();
    }catch(e){b.disabled=false;b.textContent="Try again";toast("Couldn't send: "+String(e&&e.message||e).replace(/^Error:\s*/,""))}};
}

function startCatalog(){

/** Shrinks a photo to at most 1600px and returns a JPEG Blob (no network calls, so it works inside claude.ai). */
async function photoToJpeg(file,max){
  max=max||1600;
  let src=null,w=0,h=0,url=null;
  try{src=await createImageBitmap(file);w=src.width;h=src.height}
  catch(e){
    url=URL.createObjectURL(file);
    src=await new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=()=>rej(new Error("This photo's format can't be read here. Please use a JPG or PNG photo."));im.src=url});
    w=src.naturalWidth;h=src.naturalHeight;
  }
  try{
    const sc=Math.min(1,max/Math.max(w,h));
    const c=document.createElement("canvas");c.width=Math.max(1,Math.round(w*sc));c.height=Math.max(1,Math.round(h*sc));
    const ctx=c.getContext("2d");ctx.fillStyle="#fff";ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(src,0,0,c.width,c.height);
    return await new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error("Couldn't process this photo. Please try another one.")),"image/jpeg",0.85));
  }finally{if(url) URL.revokeObjectURL(url);if(src&&src.close) try{src.close()}catch(e){}}
}
async function uploadPhoto(file){
  if(!S.assetsCap) throw new Error("Photos can't be added right now. Please reload the page.");
  let blob,type="image/jpeg";
  try{blob=await photoToJpeg(file)}
  catch(e){
    // Fall back to the original file if it is already a web-friendly image.
    if(/^image\/(jpeg|png|webp|gif)$/.test(file.type)&&file.size<20*1024*1024){blob=file;type=file.type}else throw e;
  }
  const up=()=>S.assetsCap.upload(blob,{type});
  try{return (await up()).id}
  catch(e){
    const code=e&&e.code;
    if(code==="store_unavailable"){await new Promise(r=>setTimeout(r,1200));return (await up()).id}
    const msg={quota_or_state:"Photo storage for this page is full. Delete unused photos to free space.",
      too_large:"That photo is too large. Please use a smaller one.",unsupported_type:"That file type isn't supported. Please use a JPG or PNG photo.",
      not_granted:"Photo storage isn't available in this view. Open the page in claude.ai with edit access.",capability_disabled:"Photo storage isn't available in this view. Open the page in claude.ai with edit access.",
      capability_removed:"Photo storage isn't available in this view. Open the page in claude.ai with edit access.",
      rate_limited:"Too many uploads at once. Wait a moment and try again.",upstream_auth:"Your sign-in needs refreshing. Reload the page and try again."}[code];
    throw new Error(msg||("The photo couldn't be uploaded"+(code?` (${code})`:e&&e.message?`: ${e.message}`:"")+". Please try again."));
  }
}

async function saveInventoryDb(inv,lines){
  const unit=String(inv.unit||"").toUpperCase();
  if(!S.units.some(u=>u.code===unit)) throw new Error("Please choose a business unit.");
  const name=String(inv.name||"").trim().slice(0,150);if(!name) throw new Error('Please give this inventory a name, e.g. "Initial fit-out".');
  const prodIds=new Set(S.cat.products.map(p=>p.id));
  let id=inv.id,ex=null;
  if(id){ex=(await S.db.doc("inventories/"+id).get()).data()||null}
  else{
    let n=(S.invDocs||[]).reduce((m,i)=>Math.max(m,+((String(i.id).match(/(\d+)$/)||[0,0])[1])),0)+1;
    for(;;n++){id="INV-"+pad4(n);if(!(await S.db.doc("inventories/"+id).get()).exists) break}
  }
  const old=ex?ex.lines||[]:[];
  if(ex&&ex.unit!==unit&&old.some(l=>l.tagged>0)) throw new Error(`This inventory already has tagged items in ${ex.unit}, so its business unit can't be changed.`);
  const byLine={};old.forEach(l=>byLine[l.line]=l);
  let maxLine=old.reduce((m,l)=>Math.max(m,+((String(l.line).match(/(\d+)$/)||[0,0])[1])),0);
  const out=[],kept=new Set();
  for(const l of lines||[]){
    const pid=String(l.productId||""),q=Math.max(0,Math.floor(num(l.qty)));
    if(!prodIds.has(pid)||q<=0) continue;
    const prev=l.line&&byLine[l.line]&&byLine[l.line].productId===pid?byLine[l.line]:null;
    if(prev&&q<(prev.tagged||0)) throw new Error(`Line ${prev.line} already has ${prev.tagged} tagged items, so its quantity can't go below that.`);
    const line=prev?prev.line:"L"+(++maxLine);kept.add(line);
    out.push({line,productId:pid,qty:q,location:String(l.location||"").trim().slice(0,200),notes:String(l.notes||"").trim().slice(0,500),
      tagged:prev?prev.tagged||0:0,tags:prev?tagList(prev.tags):[]});
  }
  const dropped=old.find(l=>!kept.has(l.line)&&(l.tagged||0)>0);
  if(dropped) throw new Error(`Line ${dropped.line} has tagged items and can't be removed. Set its quantity to the tagged amount instead.`);
  const now=Date.now();
  const doc={id,unit,name,date:/^\d{4}-\d{2}-\d{2}$/.test(inv.date||"")?inv.date:localDay(),
    status:INV_STATUSES.includes(inv.status)?inv.status:"Draft",notes:String(inv.notes||"").trim().slice(0,2000),lines:out,
    createdAt:ex?.createdAt||now,createdBy:ex?.createdBy||S.me||null,updatedAt:now,updatedBy:S.me||null};
  await S.db.doc("inventories/"+id).set(doc);
  return doc;
}
async function deleteInventory(id){
  const d=(await S.db.doc("inventories/"+id).get()).data();if(!d) return false;
  if((d.lines||[]).some(l=>(l.tagged||0)>0)) throw new Error("This inventory has tagged items, so it can't be deleted. Its tagged items stay in the register either way.");
  await S.db.doc("inventories/"+id).delete();return true;
}
/** Creates a QR-tagged asset for every untagged piece. Returns [{tag,unit,name}]. */
async function tagInventory(id,progress){
  const ref=S.db.doc("inventories/"+id),inv=(await ref.get()).data();
  if(!inv) throw new Error("Inventory not found.");
  const ud=(await S.db.doc("units/"+inv.unit).get()).data();
  if(!ud) throw new Error(`Business unit ${inv.unit} not found.`);
  const prods={};S.cat.products.forEach(p=>prods[p.id]=p);
  const total=(inv.lines||[]).reduce((t,l)=>t+Math.max(0,(+l.qty||0)-(+l.tagged||0)),0);
  const created=[];const now=Date.now();
  for(const l of inv.lines||[]){
    const need=(+l.qty||0)-(+l.tagged||0),p=prods[l.productId];
    if(need<=0||!p) continue;
    const newTags=[];
    for(let i=0;i<need;i++){
      const tag=await nextTagFor(typePrefix(p.type,p.name));
      const a={tag,brand:p.brand||"",model:p.model||"",unit:inv.unit,name:p.name+(p.colour?` (${p.colour})`:""),category:p.category||"Other",location:l.location||"",status:"In use",condition:"New",
        serial:p.model||"",purchased:inv.date||"",cost:p.price?String(p.price):"",notes:[p.brand,p.vendor?"Vendor: "+p.vendor:"",`From ${inv.id} ${inv.name}`].filter(Boolean).join(" · "),
        productId:p.id,createdAt:now,createdBy:S.me||null,updatedAt:now,updatedBy:S.me||null,verifiedAt:now,verifiedBy:S.me||null};
      await S.db.doc("assets/"+tag).set(a);
      await logEvent(tag,`Created from inventory ${inv.id} (${p.name})${l.location?" at "+l.location:""}`);
      newTags.push(tag);created.push({tag,unit:inv.unit,name:a.name});
      if(progress) progress(`Creating ${created.length} of ${total}…`);
    }
    l.tagged=(+l.tagged||0)+newTags.length;l.tags=[...tagList(l.tags),...newTags];
    await ref.update({lines:inv.lines,updatedAt:Date.now(),updatedBy:S.me||null});
  }
  if(created.length){await bumpUnit(inv.unit,0,created.length);allItemsCache=null}
  return created;
}

    <div class="sheet-head"><div><span class="eyebrow">${esc(p.id)} · ${esc(p.category||"Uncategorised")}</span><h3>${esc(p.name)}</h3></div><button class="btn ghost" data-close aria-label="Close">✕</button></div>
    ${gal}
    ${p.active?"":`<div class="flag"><div><b>Archived</b><div class="muted" style="font-size:13px">Hidden from the asset list and the picker. Existing inventories and assets keep it.</div></div><button class="btn" data-write id="unarch">Restore</button></div>`}
    <div class="pricebig">${money(p.price)} <span class="muted">${esc(p.uom||"each")}</span></div>
    <dl class="facts">
      <dt>Asset type</dt><dd>${esc(p.type)||"<span class='muted'>Not set</span>"}</dd>
      <dt>Brand</dt><dd>${esc(p.brand)||"<span class='muted'>Not set</span>"}</dd>
      ${p.model?`<dt>Model / SKU</dt><dd class="mono">${esc(p.model)}</dd>`:""}
      <dt>Colour</dt><dd>${swatch(p.colour)||"<span class='muted'>Not set</span>"}</dd>
      <dt>Vendor</dt><dd>${esc(p.vendor)||"<span class='muted'>Not set</span>"}${vendorLine(p.vendor)}</dd>
      ${p.description?`<dt>Description</dt><dd style="white-space:pre-wrap">${esc(p.description)}</dd>`:""}
    </dl>
    <div class="actions"><button class="btn primary" data-write id="pAdd">Add to a unit</button><button class="btn" data-write id="pEdit">Edit</button><button class="btn danger" data-write id="pDel">${p.inUse?"Archive":"Delete"}</button></div>
    <div><span class="eyebrow">Where it is</span><div id="pUse" class="muted" style="margin-top:8px;font-size:14px">Loading…</div></div>
  </div></div>`;
  const g=$("#pdetail .gthumbs");if(g) g.onclick=e=>{const b=e.target.closest("[data-ph]");if(!b) return;g.querySelectorAll("button").forEach(x=>x.removeAttribute("aria-current"));b.setAttribute("aria-current","true");
    const big=$("#pdetail .gbig");big.classList.remove("broken");delete big.dataset.fb;big.src=photoUrl(b.dataset.ph)};
  $("#pEdit").onclick=()=>openProductForm(p);
  $("#pAdd").onclick=()=>{closeOverlay();newInventory([{productId:p.id,qty:1}])};
  $("#pDel").onclick=()=>confirmDeleteProduct(p);
  const ua=$("#unarch");if(ua) ua.onclick=async()=>{try{await saveProduct({...p,active:true});toast("Restored");setTimeout(()=>openProduct(p.id),300)}catch(e){fail(e)}};
  applyWriteGate();
  try{const u=await productUsage(p.id);const el=$("#pUse");if(!el) return;
    el.innerHTML=u.units.length?`<ul class="log">${u.units.map(x=>`<li><span><b class="num">${x.qty}</b> in ${esc(unitName(x.unit))} <span class="muted">· ${x.tagged} tagged${x.untagged?`, ${x.untagged} not yet tagged`:""}</span></span></li>`).join("")}</ul><p class="hint" style="margin:8px 0 0">${u.tagged} tagged individually${u.disposed?` · ${u.disposed} disposed`:""}. Follows transfers and disposals.</p>`

function vendorLine(name){const v=S.cat&&S.cat.vendors.find(x=>x.name===name);if(!v) return "";

function confirmDeleteProduct(p){
  modal(`<h3>${p.inUse?"Archive":"Delete"} ${esc(p.name)}?</h3><p style="margin:0">${p.inUse?"This asset is used in inventories, so it will be archived: hidden from the asset list and the picker, while existing inventories and tagged items keep it.":"This removes the asset from the list. Its photos stay in your Google Drive folder."}</p>
   <div class="row-end"><button class="btn" data-close>Keep it</button><button class="btn danger" id="pdGo">${p.inUse?"Archive":"Delete"}</button></div>`);

/* ---------- product form ---------- */
function openProductForm(p,opts){
  const isNew=!p;p=p||{name:"",category:"",type:"",brand:"",model:"",colour:"",vendor:"",price:"",uom:"each",description:"",photos:[],active:true};
  const L=S.cat.lists,photos=[...p.photos];
  const dl=(id,vals)=>`<datalist id="${id}">${vals.map(x=>`<option value="${esc(x)}">`).join("")}</datalist>`;
  modal(`<h3>${isNew?"New asset":"Edit "+esc(p.id)}</h3>
   <form class="grid" id="pf">
    <div class="field full"><label for="p-name">Asset name <span class="req">*</span></label><input id="p-name" required value="${esc(p.name)}" placeholder="e.g. Ergonomic task chair"></div>
    <div class="field"><label for="p-cat">Category</label><input id="p-cat" list="dl-pcat" value="${esc(p.category)}" placeholder="Pick or type a new one">${dl("dl-pcat",allCategories())}</div>
    <div class="field"><label for="p-type">Asset type</label><input id="p-type" list="dl-ptype" value="${esc(p.type)}" placeholder="e.g. Chair">${dl("dl-ptype",L.type)}</div>
    <div class="field"><label for="p-brand">Brand</label><input id="p-brand" list="dl-pbrand" value="${esc(p.brand)}">${dl("dl-pbrand",L.brand)}</div>
    <div class="field"><label for="p-model">Model / SKU</label><input id="p-model" value="${esc(p.model)}"></div>
    <div class="field"><label for="p-colour">Colour</label><input id="p-colour" list="dl-pcol" value="${esc(p.colour)}">${dl("dl-pcol",L.colour)}</div>
    <div class="field"><label for="p-vendor">Vendor</label><input id="p-vendor" list="dl-pven" value="${esc(p.vendor)}" placeholder="Pick or type a new vendor">${dl("dl-pven",S.cat.vendors.map(v=>v.name))}</div>
    <div class="field"><label for="p-price">Price (${esc(S.cat.currency)})</label><input id="p-price" inputmode="decimal" value="${esc(p.price)}" placeholder="0.00"></div>
    <div class="field"><label for="p-uom">Unit of measure</label><input id="p-uom" list="dl-uom" value="${esc(p.uom||"each")}">${dl("dl-uom",["each","set","pair","pack","box","metre","sq m"])}</div>
    <div class="field full"><label for="p-desc">Description</label><textarea id="p-desc" placeholder="Size, material, warranty, care instructions…">${esc(p.description)}</textarea></div>
    <div class="field full"><span class="flabel">Photos <span class="hint">(up to 6; the first one is the main photo)</span></span>
      <div class="phgrid" id="phgrid"></div>
      ${S.assetsCap?`<label class="btn" id="phAdd">+ Add photos<input type="file" id="phInput" accept="image/\x2a" multiple hidden></label>`:`<span class="hint" id="phAdd">Photos can't be added right now. Please reload the page.</span>`}
      <span class="hint" id="phStatus"></span></div>
    <p class="hint full" style="margin:0">New categories, types, brands, colours and vendors you type are added to the pick-lists automatically.</p>
    <div class="row-end full"><button class="btn" type="button" data-close>Cancel</button><button class="btn primary" type="submit" id="pSave">${isNew?"Add asset":"Save changes"}</button></div>
   </form>`);
  $("#p-name").focus();
  let uploading=0;
  const drawPhotos=()=>{
    $("#phgrid").innerHTML=photos.map((id,i)=>`<div class="ph">${photoImg(id,240)}<div class="phbar">${i?`<button type="button" data-main="${i}" title="Make main photo">★</button>`:`<span class="mainb">Main</span>`}<button type="button" data-rm="${i}" aria-label="Remove photo">✕</button></div></div>`).join("");
    if($("#phInput")) $("#phAdd").hidden=photos.length>=6;
  };
  drawPhotos();
  $("#phgrid").onclick=e=>{const r=e.target.closest("[data-rm]"),m=e.target.closest("[data-main]");
    if(r){photos.splice(+r.dataset.rm,1);drawPhotos()} if(m){const [x]=photos.splice(+m.dataset.main,1);photos.unshift(x);drawPhotos()}};
  if($("#phInput")) $("#phInput").onchange=async e=>{
    const files=[...e.target.files].slice(0,6-photos.length);e.target.value="";
    for(const f of files){
      uploading++;$("#phStatus").textContent=`Uploading ${uploading} photo${uploading>1?"s":""}…`;$("#pSave").disabled=true;
      try{const id=await uploadPhoto(f);photos.push(id);drawPhotos()}
      catch(err){console.error(err);toast(err&&err.message?err.message:"The photo couldn't be added.")}
      finally{uploading--;$("#phStatus").textContent=uploading?`Uploading ${uploading}…`:"";$("#pSave").disabled=uploading>0}
    }
  };
  $("#pf").onsubmit=async e=>{
    e.preventDefault();if(uploading) return;
    const v=id=>$("#"+id).value.trim();
    if(!v("p-name")){$("#p-name").focus();return}
    const b=$("#pSave");b.disabled=true;b.textContent="Saving…";
    const data={id:p.id,name:v("p-name"),category:v("p-cat"),type:v("p-type"),brand:v("p-brand"),model:v("p-model"),colour:v("p-colour"),
      vendor:v("p-vendor"),price:v("p-price"),uom:v("p-uom"),description:v("p-desc"),photos,active:p.active!==false};
    try{const id=await saveProduct(data);closeOverlay();
      if(opts&&opts.onSaved){for(let i=0;i<40&&!prodById(id);i++) await new Promise(r=>setTimeout(r,100));opts.onSaved(id);return}
      toast(isNew?`Added ${id}`:"Saved");setTimeout(()=>openProduct(id),300)}
    catch(err){b.disabled=false;b.textContent=isNew?"Add asset":"Save changes";fail(err)}
  };
}

/* ---------- inventories list ---------- */
function invStatusCls(s){return s==="Completed"?"s-inuse":s==="Confirmed"?"s-repair":"s-storage"}
function renderInventories(v){
  if(!S.invs||!S.cat){v.innerHTML=`<div class="empty"><h3>Loading inventories…</h3></div>`;return}
  const f=S.invFilter;
  const inScope=i=>!f.unit||(f.unit.startsWith("P:")?(S.units.find(u=>u.code===i.unit)||{}).property===f.unit.slice(2):i.unit===f.unit);
  const rows=S.invs.filter(i=>inScope(i)&&(!f.status||i.status===f.status)).sort((a,b)=>String(b.date).localeCompare(String(a.date))||b.id.localeCompare(a.id));
  const sum=rows.reduce((t,i)=>({items:t.items+i.items,tagged:t.tagged+i.tagged,value:t.value+i.value}),{items:0,tagged:0,value:0});
  v.innerHTML=`<div class="pagehead"><div><h2>Inventories${f.unit?` · ${esc(f.unit.startsWith("P:")?propName(f.unit.slice(2)):unitLabel(f.unit))}`:""}</h2><div class="sub">Assets assigned to units, with quantities. <span class="num">${rows.length}</span> inventor${rows.length===1?"y":"ies"} · <span class="num">${sum.items.toLocaleString()}</span> items · ${money(sum.value)}</div></div>
    <div class="actions"><button class="btn primary" data-write id="invNew" ${S.units.length?"":"disabled"}>+ New inventory</button><button class="btn" onclick="openReport()">Inventory report</button></div></div>
    ${invTabs()}
    <div class="toolbar"><select id="ifUnit" aria-label="Business unit"><option value="">All properties and units</option>${groupedUnits().map(g=>`<optgroup label="${esc(g.name)}">${g.prop?`<option value="P:${esc(g.prop)}" ${f.unit==="P:"+g.prop?"selected":""}>All of ${esc(g.name)}</option>`:""}${g.units.map(u=>`<option value="${esc(u.code)}" ${f.unit===u.code?"selected":""}>${esc(u.name)}</option>`).join("")}</optgroup>`).join("")}</select>
      <select id="ifStatus" aria-label="Status"><option value="">All statuses</option>${INV_STATUSES.map(s=>`<option ${f.status===s?"selected":""}>${s}</option>`).join("")}</select></div>
    ${rows.length?`<div class="ledger-wrap"><table class="ledger"><thead><tr><th>ID</th><th>Inventory</th><th>Unit</th><th>Date</th><th>Status</th><th style="text-align:right">Items</th><th>Tagged</th><th style="text-align:right">Here now</th><th style="text-align:right">Value</th></tr></thead><tbody>
      ${rows.map(i=>`<tr data-inv="${esc(i.id)}"><td><span class="tagchip">${esc(i.id)}</span></td><td>${esc(i.name)}<div class="muted" style="font-size:12.5px">${i.lines} asset${i.lines===1?"":"s"}</div></td><td>${esc((S.units.find(u=>u.code===i.unit)||{}).name||i.unit)}<div class="muted" style="font-size:12.5px">${esc(propName((S.units.find(u=>u.code===i.unit)||{}).property))}</div></td><td class="muted num">${esc(fmtDate(Date.parse(i.date+"T00:00:00")))}</td>
        <td><span class="pill ${invStatusCls(i.status)}"><span class="dot"></span>${esc(i.status)}</span></td><td class="num mono" style="text-align:right">${i.items}</td>
        <td><div class="minibar" title="${i.tagged} of ${i.items} tagged"><i style="width:${i.items?Math.round(i.tagged/i.items*100):0}%"></i></div><span class="muted num" style="font-size:12.5px">${i.tagged}/${i.items}</span></td><td class="num mono" style="text-align:right">${(()=>{if(!S.itemsByTag) return `<span class="muted">…</span>`;const d=invDoc(i.id);if(!d) return "";
          const r=d.lines.reduce((t,l)=>{const x=lineStatus(d,l);return {here:t.here+x.here+Math.max(0,(+l.qty||0)-(+l.tagged||0)),moved:t.moved+x.moved,disp:t.disp+x.disposed}},{here:0,moved:0,disp:0});
          return `${r.here}${r.moved||r.disp?`<div class="muted" style="font-size:12px">${[r.moved?r.moved+" moved":"",r.disp?r.disp+" disposed":""].filter(Boolean).join(" · ")}</div>`:""}`})()}</td><td class="num" style="text-align:right;white-space:nowrap">${money(i.value)}</td></tr>`).join("")}
    </tbody></table></div>`
    :`<div class="empty"><h3>${S.invs.length?"No inventories match":"No inventories yet"}</h3><p>An inventory is a list of assets placed in one unit, such as "Initial fit-out" or "Q4 plant refresh". Pick assets (or create new ones), set quantities and locations, then create tags for them when you're ready.</p>${S.units.length?`<button class="btn primary" onclick="newInventory()">+ New inventory</button>`:`<p class="hint" style="margin:0">Add a business unit first.</p>`}</div>`}`;
  if(!S.itemsByTag&&rows.length) loadAllItems().then(()=>{if(S.view==="inventories") renderView()}).catch(()=>{});
  $("#ifUnit").onchange=e=>{S.invFilter.unit=e.target.value;renderView()};
  $("#ifStatus").onchange=e=>{S.invFilter.status=e.target.value;renderView()};
  $("#invNew").onclick=()=>newInventory();wireInvTabs();
  v.querySelector("tbody")?.addEventListener("click",e=>{const r=e.target.closest("tr[data-inv]");if(r) openInventory(r.dataset.inv)});
  applyWriteGate();
}

/* ---------- inventory editor ---------- */
function newInventory(prefill){
  if(!S.units.length){toast("Add a business unit first");return}
  const unit=(S.invFilter.unit&&!S.invFilter.unit.startsWith("P:")?S.invFilter.unit:"")||S.unit||(S.units.find(u=>S.prop&&u.property===S.prop)||groupedUnits()[0]?.units[0]||{}).code;
  S.edit={inv:{unit,name:"",date:localDay(),status:"Draft",notes:""},lines:(prefill||[]).map(l=>({...l,location:"",notes:"",tagged:0}))};
  S.dirty=!!(prefill&&prefill.length);S.view="inv-edit";S.unit=null;renderUnits();renderView();
  setTimeout(()=>$("#ie-name")?.focus(),50);
}
async function openInventory(id){
  try{await loadCatalog();const d=invDoc(id);if(!d){toast("Inventory not found");return}
    S.edit={inv:{id:d.id,unit:d.unit,name:d.name,date:d.date,status:d.status,notes:d.notes},lines:d.lines.map(l=>({...l}))};
    S.dirty=false;S.view="inv-edit";S.unit=null;renderUnits();renderView();window.scrollTo(0,0)}catch(e){fail(e)}
}
function confirmDiscard(go){
  modal(`<h3>Discard changes?</h3><p style="margin:0">This inventory has changes that haven't been saved.</p>
   <div class="row-end"><button class="btn" data-close>Keep editing</button><button class="btn danger" id="dcGo">Discard</button></div>`);
  $("#dcGo").onclick=()=>{closeOverlay();S.dirty=false;go()};
}
function invTotals(){
  return S.edit.lines.reduce((t,l)=>{const p=prodById(l.productId);const q=+l.qty||0;
    return {items:t.items+q,value:t.value+q*(p?p.price:0),untagged:t.untagged+Math.max(0,q-(l.tagged||0)),tagged:t.tagged+Math.min(l.tagged||0,q)}},{items:0,value:0,untagged:0,tagged:0});
}

      <div class="sub">${saved?`<span class="tagchip">${esc(inv.id)}</span> · `:""}<span class="num">${t.items}</span> items · ${money(t.value)}${t.tagged?` · ${t.tagged} tagged`:""}${S.dirty?` · <span class="stale">Unsaved changes</span>`:""}</div></div>
    <div class="actions"><button class="btn primary" data-write id="ieSave">${saved?"Save changes":"Save inventory"}</button>
      ${saved&&t.untagged?`<button class="btn" data-write id="ieTag">Create tags (${t.untagged})</button>`:""}
      ${saved&&t.tagged?`<button class="btn" id="ieLabels">Download labels</button>`:""}

    <section class="panel"><div class="grid4">
      <div class="field"><label for="ie-unit">Unit <span class="req">*</span></label><select id="ie-unit" ${lockedUnit?"disabled":""}>${unitOptions(inv.unit)}</select>${lockedUnit?`<span class="hint">Locked: some items are already tagged.</span>`:""}</div>
      <div class="field span2"><label for="ie-name">Inventory name <span class="req">*</span></label><input id="ie-name" value="${esc(inv.name)}" placeholder="e.g. Initial fit-out, Q4 plant refresh"></div>
      <div class="field"><label for="ie-date">Date</label><input id="ie-date" type="date" value="${esc(inv.date)}"></div>
      <div class="field"><label for="ie-status">Status</label><select id="ie-status">${INV_STATUSES.map(s=>`<option ${inv.status===s?"selected":""}>${s}</option>`).join("")}</select></div>
      <div class="field span3"><label for="ie-notes">Notes</label><input id="ie-notes" value="${esc(inv.notes)}" placeholder="PO number, delivery date, who requested it…"></div>
    </div></section>
    ${invDocsHtml(inv.id)}
    <div class="pagehead" style="margin-top:4px"><h3 class="h3">Assets</h3><div class="actions"><button class="btn primary" data-write id="ieAdd">+ Add assets</button><button class="btn" data-write id="ieNewAsset">+ New asset</button></div></div>
    ${E.lines.length?`<div class="ledger-wrap"><table class="ledger lines"><thead><tr><th>Asset</th><th style="width:96px">Qty</th><th>Location</th><th>Notes</th><th style="text-align:right">Line value</th><th>Tagged</th><th></th></tr></thead><tbody>
      ${E.lines.map((l,i)=>{const p=prodById(l.productId)||{name:"(deleted asset)",price:0,photos:[]};const tg=l.tagged||0;
        return `<tr data-i="${i}"><td><div class="lprod">${thumb(p,120,"lthumb")}<div><b>${esc(p.name)}</b><div class="muted" style="font-size:12.5px">${esc([p.id,p.brand,p.colour].filter(Boolean).join(" · "))} · ${money(p.price)}</div></div></div></td>
        <td><input class="lin num" type="number" min="${Math.max(1,tg)}" data-k="qty" value="${esc(l.qty)}" aria-label="Quantity"></td>
        <td><input class="lin" data-k="location" value="${esc(l.location)}" placeholder="Room, floor or desk" aria-label="Location"></td>
        <td><input class="lin" data-k="notes" value="${esc(l.notes)}" aria-label="Notes"></td>
        <td class="num" style="text-align:right;white-space:nowrap">${money((+l.qty||0)*p.price)}</td>
        <td class="muted num" style="font-size:13px">${tg?`<span title="${esc(tagList(l.tags).join(", "))}">${tg}/${l.qty}</span>${(()=>{if(!S.itemsByTag||!inv.id) return "";const x=lineStatus(inv,l);
          return x.moved||x.disposed?`<div class="lmoves">${x.moved?`<span class="mv">${x.moved} moved to ${Object.keys(x.where).map(w=>esc((S.units.find(u=>u.code===w)||{}).name||w)).join(", ")}</span>`:""}${x.disposed?`<span class="dp">${x.disposed} disposed</span>`:""}</div>`:""})()}`:"—"}</td>
        <td><button class="btn ghost" data-rm="${i}" ${tg?`disabled title="Already tagged"`:""} aria-label="Remove line">✕</button></td></tr>`}).join("")}
      </tbody><tfoot><tr><td><b>Total</b></td><td class="num"><b>${t.items}</b></td><td></td><td></td><td class="num" style="text-align:right;white-space:nowrap"><b>${money(t.value)}</b></td><td class="muted num">${t.tagged}/${t.items}</td><td></td></tr></tfoot></table></div>
      <p class="hint" style="margin:0">Quantities are kept as a list. When you're ready to label items individually, save and use <b>Create tags</b>: each untagged piece gets its own tag in ${esc(unitName(inv.unit))}, linked to the asset.</p>`
    :`<div class="empty"><h3>No assets yet</h3><p>Add assets from your list, or create new ones, then set a quantity and location for each.</p><div class="actions"><button class="btn primary" onclick="openPicker()">+ Add assets</button><button class="btn" data-write onclick="newAssetForInventory()">+ New asset</button></div></div>`}`;
  const mark=()=>{if(!S.dirty){S.dirty=true;const sub=v.querySelector(".pagehead .sub");if(sub&&!/Unsaved/.test(sub.innerHTML)) sub.insertAdjacentHTML("beforeend",` · <span class="stale">Unsaved changes</span>`)}};
  [["ie-unit","unit"],["ie-name","name"],["ie-date","date"],["ie-status","status"],["ie-notes","notes"]].forEach(([id,k])=>{
    const el=$("#"+id);el.oninput=el.onchange=()=>{inv[k]=el.value;mark();if(k==="unit") renderView()}});
  const tb=v.querySelector("table.lines tbody");
  if(tb){
    tb.addEventListener("input",e=>{const el=e.target.closest(".lin");if(!el) return;const l=E.lines[+el.closest("tr").dataset.i];l[el.dataset.k]=el.value;mark()});
    tb.addEventListener("change",e=>{const el=e.target.closest('.lin[data-k="qty"]');if(!el) return;const l=E.lines[+el.closest("tr").dataset.i];
      l.qty=Math.max(Math.max(1,l.tagged||0),parseInt(el.value,10)||1);renderView()});
    tb.addEventListener("click",e=>{const b=e.target.closest("[data-rm]");if(!b) return;E.lines.splice(+b.dataset.rm,1);S.dirty=true;renderView()});
  }
  $("#ieBack").onclick=()=>selectUnit("__inventories");
  wireInvDocs(inv);
  $("#ieAdd").onclick=openPicker;
  const na=$("#ieNewAsset");if(na) na.onclick=newAssetForInventory;
  $("#ieSave").onclick=()=>saveInventory();
  const tg=$("#ieTag");if(tg) tg.onclick=()=>confirmTag();
  const lb=$("#ieLabels");if(lb) lb.onclick=()=>printInvLabels();
  const dl=$("#ieDel");if(dl) dl.onclick=()=>{modal(`<h3>Delete this inventory?</h3><p style="margin:0">${esc(inv.name)} and its list will be removed. Assets stay in your asset list.</p>
    <div class="row-end"><button class="btn" data-close>Keep it</button><button class="btn danger" id="idGo">Delete</button></div>`);
    $("#idGo").onclick=async()=>{try{await deleteInventory(inv.id);closeOverlay();toast("Inventory deleted");S.dirty=false;selectUnit("__inventories",true)}catch(e){fail(e)}}};
  applyWriteGate();
}
async function saveInventory(then){
  const E=S.edit,inv=E.inv;
  if(!inv.name.trim()){toast("Please give this inventory a name");$("#ie-name")?.focus();return false}
  const b=$("#ieSave");if(b){b.disabled=true;b.textContent="Saving…"}
  try{
    const d=await saveInventoryDb(inv,E.lines.map(l=>({line:l.line,productId:l.productId,qty:l.qty,location:l.location,notes:l.notes})));
    S.edit={inv:{id:d.id,unit:d.unit,name:d.name,date:d.date,status:d.status,notes:d.notes},lines:d.lines.map(l=>({...l}))};
    S.dirty=false;
    toast("Inventory saved");renderView();if(then) then();return true;
  }catch(e){fail(e);if(b){b.disabled=false;b.textContent="Save"}return false}
}
function confirmTag(){
  const t=invTotals(),inv=S.edit.inv;
  modal(`<h3>Create ${t.untagged} tag${t.untagged===1?"":"s"}?</h3>
   <p style="margin:0">Each untagged piece gets its own tagged record in <b>${esc(unitName(inv.unit))}</b> with its own tag in the form <span class="tagchip">TWC-CHR-0001</span> (chairs), <span class="tagchip">TWC-TBL-0001</span> (tables and desks) or <span class="tagchip">TWC-MSC-0001</span> (everything else), using the asset's name, colour, category, price and the line's location. You can then download their labels to print.</p>
   <ul class="report-list">${S.edit.lines.filter(l=>(l.qty-(l.tagged||0))>0).map(l=>{const p=prodById(l.productId)||{name:l.productId};return `<li>${l.qty-(l.tagged||0)} × ${esc(p.name)}${l.location?` <span class="muted">· ${esc(l.location)}</span>`:""}</li>`}).join("")}</ul>
   <div class="row-end"><button class="btn" data-close>Cancel</button><button class="btn primary" id="tgGo">Create ${t.untagged} tag${t.untagged===1?"":"s"}</button></div>`);
  $("#tgGo").onclick=async()=>{
    const b=$("#tgGo");b.disabled=true;b.textContent="Creating…";
    try{
      if(S.dirty&&!(await saveInventory())) return;
      const made=await tagInventory(S.edit.inv.id,t=>{b.textContent=t});
      await saveInventoryReload();
      modal(`<h3>${made.length} item${made.length===1?"":"s"} tagged</h3><p style="margin:0">Tags ${esc(made[0]?.tag||"")}${made.length>1?" to "+esc(made[made.length-1].tag):""} are now in ${esc(unitName(S.edit.inv.unit))}. Download their labels, print them and stick one on each piece.</p>
        <div class="row-end"><button class="btn" data-close>Done</button><button class="btn primary" id="tgPrint">Download ${made.length} label${made.length===1?"":"s"}</button></div>`);
      $("#tgPrint").onclick=()=>{downloadLabels(made);closeOverlay()};
    }catch(e){b.disabled=false;b.textContent="Try again";fail(e)}
  };
}
async function saveInventoryReload(){const d=(await S.db.doc("inventories/"+S.edit.inv.id).get()).data();
  S.edit={inv:{id:d.id,unit:d.unit,name:d.name,date:d.date,status:d.status,notes:d.notes},lines:d.lines.map(l=>({...l}))};S.dirty=false;renderView()}
function printInvLabels(){
  const list=[];S.edit.lines.forEach(l=>{const p=prodById(l.productId)||{name:""};
    tagList(l.tags).forEach(tag=>list.push({tag,unit:S.edit.inv.unit,name:p.name+(p.colour?` (${p.colour})`:"")}))});
  if(!list.length){toast("No tagged items yet");return}
  downloadLabels(list);
}

function newAssetForInventory(){
  openProductForm(null,{onSaved:id=>{
    if(!S.edit) return;
    S.edit.lines.push({productId:id,qty:1,location:"",notes:"",tagged:0,tags:[]});S.dirty=true;renderView();
    toast("New asset created and added to this inventory");
  }});
}
/* ---------- product picker ---------- */
function openPicker(){
  const pick={},f={q:"",category:""};
  const prods=()=>S.cat.products.filter(p=>p.active&&(!f.category||p.category===f.category)&&(!f.q||[p.name,p.brand,p.model,p.type,p.colour,p.id].some(x=>String(x||"").toLowerCase().includes(f.q.toLowerCase()))))
    .sort((a,b)=>a.category.localeCompare(b.category)||a.name.localeCompare(b.name));
  modal(`<h3>Add assets</h3>
   <div class="toolbar"><input id="pkQ" placeholder="Search assets" aria-label="Search assets"><select id="pkCat" aria-label="Category"><option value="">All categories</option>${[...new Set(S.cat.products.filter(p=>p.active).map(p=>p.category).filter(Boolean))].sort().map(c=>`<option>${esc(c)}</option>`).join("")}</select></div>
   <ul class="picker" id="pkList"></ul>
   <div class="row-end"><span class="muted" id="pkCount" style="margin-right:auto;align-self:center"></span><button class="btn" type="button" id="pkNewProd">+ New asset</button><button class="btn" data-close>Cancel</button><button class="btn primary" id="pkGo" disabled>Add</button></div>`);
  const draw=()=>{
    const list=prods();
    $("#pkList").innerHTML=list.map(p=>`<li class="${pick[p.id]?"on":""}" data-id="${esc(p.id)}">${thumb(p,120,"lthumb")}<div class="pk-t"><b>${esc(p.name)}</b><span class="muted">${esc([p.brand,p.type,p.colour].filter(Boolean).join(" · "))} · ${money(p.price)}</span></div>
      <div class="qty"><button type="button" data-d="-1" aria-label="Fewer">−</button><input type="number" min="0" value="${pick[p.id]||0}" aria-label="Quantity of ${esc(p.name)}"><button type="button" data-d="1" aria-label="More">+</button></div></li>`).join("")||`<li class="muted" style="padding:16px">No assets match. Use New asset to create one.</li>`;
    const n=Object.keys(pick).length,q=Object.values(pick).reduce((a,b)=>a+b,0);
    $("#pkCount").textContent=n?`${n} asset${n===1?"":"s"}, ${q} item${q===1?"":"s"}`:"";$("#pkGo").disabled=!n;$("#pkGo").textContent=n?`Add ${q} item${q===1?"":"s"}`:"Add";
  };
  const set=(id,v)=>{v=Math.max(0,Math.min(9999,parseInt(v,10)||0));if(v) pick[id]=v;else delete pick[id];draw()};
  $("#pkList").addEventListener("click",e=>{const li=e.target.closest("li[data-id]");if(!li) return;const b=e.target.closest("[data-d]");
    if(b) set(li.dataset.id,(pick[li.dataset.id]||0)+(+b.dataset.d));else if(!e.target.closest("input")) set(li.dataset.id,(pick[li.dataset.id]||0)+1)});
  $("#pkList").addEventListener("change",e=>{const li=e.target.closest("li[data-id]");if(li&&e.target.matches("input")) set(li.dataset.id,e.target.value)});
  $("#pkQ").oninput=e=>{f.q=e.target.value;draw()};$("#pkCat").onchange=e=>{f.category=e.target.value;draw()};
  $("#pkNewProd").onclick=()=>{closeOverlay();newAssetForInventory()};
  $("#pkGo").onclick=()=>{
    Object.entries(pick).forEach(([id,q])=>{const ex=S.edit.lines.find(l=>l.productId===id&&!l.location);
      if(ex) ex.qty=(+ex.qty||0)+q;else S.edit.lines.push({productId:id,qty:q,location:"",notes:"",tagged:0,tags:""})});
    S.dirty=true;closeOverlay();renderView();
  };
  draw();$("#pkQ").focus();
}

/* ---------- Boot ---------- */
renderUnits();renderView();
(async()=>{
  const c=window.claude;
  const [db,user,dl,assetsCap]=await Promise.all([c?.use?.("db"),c?.use?.("user"),c?.use?.("downloads"),c?.use?.("assets")].map(p=>Promise.resolve(p).catch(()=>null)));
  S.dl=dl||null;S.user=user||null;S.assetsCap=assetsCap||null;
  if(!db){S.dbMissing=true;$("#connState").textContent="offline";renderView();return}
  S.db=db;
  if(user){try{S.me=await user.id()}catch(e){} try{S.myName=await user.name()}catch(e){} try{const w=await user.can("data.write");if(w===false) S.canWrite=false}catch(e){}}
  $("#connState").textContent=S.canWrite?"shared register":"view only";
  db.collection("assets").where("needsLabel","==",true).limit(1000).onSnapshot(snap=>{
    S.reprint=snap.docs.map(d=>d.data());renderUnits();if(S.view==="reprint") renderView();
  },e=>console.warn("reprint list",e));
  db.collection("properties").limit(1000).onSnapshot(snap=>{S.props=snap.docs.map(d=>d.data()).filter(p=>p&&p.code);renderUnits();if(!S.unit&&!S.view) renderView()},e=>console.warn("properties",e));
  db.collection("units").orderBy("code").limit(1000).onSnapshot(snap=>{
    S.units=snap.docs.map(d=>d.data());renderUnits();
    if(S.unit&&!S.units.some(u=>u.code===S.unit)) S.unit=null;
    renderView();
  },e=>{toast("Couldn't load units: "+e.message)});
  db.collection("documents").limit(1000).onSnapshot(snap=>{S.docs=snap.docs.map(d=>d.data()).filter(d=>d&&d.id);renderUnits();
    if(S.view==="documents"&&!$("#overlay").innerHTML) renderView();if(S.view==="inv-edit"&&!S.dirty&&!$("#overlay").innerHTML) renderView()},e=>{S.docs=[];console.warn("documents",e)});
  startCatalog();
  const t=S.pendingTag||hashTag();if(t) openAsset(t);
})();
</script>

</body>
</html>
