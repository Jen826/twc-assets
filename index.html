<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TWC Assets">
<meta name="theme-color" content="#1b2127">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2214%22 fill=%22%231b2127%22/%3E%3Cpath d=%22M18 26v-8h8M38 18h8v8M46 38v8h-8M26 46h-8v-8%22 stroke=%22%23f0913a%22 stroke-width=%225%22 fill=%22none%22/%3E%3Crect x=%2228%22 y=%2228%22 width=%228%22 height=%228%22 fill=%22%23fff%22/%3E%3C/svg%3E">
<script>window.TWC_API="https://script.google.com/macros/s/AKfycbwGuAgpMhB8TxNJzAvi6Q3XEQdlxLa0DRqWZ3lr0JOJzmvYsSgRmF8uUSYzal-CQRiojw/exec";</script>
</head>
<body>
<title>TWC Assets & Inventory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: scan bar on top, business-unit rail on the left, asset ledger in the middle, asset card slides over on the right. Tags read like aluminium property labels. */
:root{
  --bg:#f3f4f2; --surface:#ffffff; --sunk:#e8eae6; --line:#d5d8d2; --ink:#1b2127; --muted:#5d666e;
  --accent:#b85c00; --accent-ink:#ffffff; --accent-soft:#f6e6d3;
  --tag:#dde1e3; --tag-ink:#20262c;
  --ok:#2f7a4b; --ok-soft:#dcefe2; --warn:#9a6a00; --warn-soft:#f6ecc9; --bad:#b0362f; --bad-soft:#f6dcda; --idle:#56606a; --idle-soft:#e3e6e8;
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:6px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#14181b; --surface:#1c2125; --sunk:#111417; --line:#2f363c; --ink:#e7eaec; --muted:#9aa4ab;
  --accent:#f0913a; --accent-ink:#1a1206; --accent-soft:#3a2a18;
  --tag:#2c3339; --tag-ink:#e3e7ea;
  --ok:#6cc68e; --ok-soft:#1d3226; --warn:#e3b649; --warn-soft:#3a3118; --bad:#ef7d74; --bad-soft:#3d2220; --idle:#aab3ba; --idle-soft:#2a3035;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14181b; --surface:#1c2125; --sunk:#111417; --line:#2f363c; --ink:#e7eaec; --muted:#9aa4ab;
  --accent:#f0913a; --accent-ink:#1a1206; --accent-soft:#3a2a18;
  --tag:#2c3339; --tag-ink:#e3e7ea;
  --ok:#6cc68e; --ok-soft:#1d3226; --warn:#e3b649; --warn-soft:#3a3118; --bad:#ef7d74; --bad-soft:#3d2220; --idle:#aab3ba; --idle-soft:#2a3035;
  color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono)}
.app{display:grid;grid-template-rows:auto 1fr;min-height:100%}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--ink);color:var(--bg);padding:12px 16px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand h1{margin:0;font-family:var(--f-display);font-stretch:80%;font-weight:800;font-size:22px;letter-spacing:.01em;text-transform:uppercase}
.brand small{font-family:var(--f-mono);font-size:12px;opacity:.7}
.scan{flex:1 1 320px;display:flex;gap:8px;min-width:0}
.scan input{flex:1;min-width:0;background:var(--surface);color:var(--ink);border:2px solid transparent;border-radius:var(--r);padding:9px 12px;font-family:var(--f-mono);font-size:15px}
.scan input:focus{border-color:var(--accent);outline:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:var(--r);padding:8px 13px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);border-color:var(--line)}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.btn:disabled{opacity:.45;cursor:not-allowed}
header .btn{border-color:transparent}
.btn svg{width:17px;height:17px;flex:none}

.shell{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:0}
aside.units{border-right:1px solid var(--line);background:var(--sunk);padding:16px 12px;overflow:auto;display:flex;flex-direction:column;gap:12px;max-height:calc(100vh - 62px);position:sticky;top:62px}
.rail-head{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:0 4px}
.eyebrow{font-family:var(--f-display);font-stretch:85%;font-weight:700;font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.unit-filter{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:7px 10px}
.unit-list{display:flex;flex-direction:column;gap:2px;margin:0;padding:0;list-style:none}
.unit-list button{width:100%;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;text-align:left;border:0;background:transparent;border-radius:var(--r);padding:7px 8px;cursor:pointer}
.unit-list button:hover{background:var(--surface)}
.unit-list button[aria-current="true"]{background:var(--surface);box-shadow:inset 3px 0 0 var(--accent)}
.unit-list .code{font-family:var(--f-mono);font-size:12px;font-weight:600;background:var(--tag);color:var(--tag-ink);padding:2px 6px;border-radius:3px}
.unit-list .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.unit-list .ct{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.unit-mobile{display:none}

main{padding:20px 24px 60px;min-width:0;display:flex;flex-direction:column;gap:18px}
.pagehead{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between}
.pagehead h2{margin:0;font-family:var(--f-display);font-stretch:85%;font-weight:700;font-size:28px;line-height:1.1;text-wrap:balance}
.pagehead .sub{color:var(--muted);font-size:14px;margin-top:4px}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.stats{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:13px;font-weight:500;white-space:nowrap;border:1px solid transparent;cursor:pointer;background:var(--surface);border-color:var(--line)}
.chip .n{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{border-color:var(--ink)}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.s-inuse{--c:var(--ok);--cs:var(--ok-soft)} .s-storage{--c:var(--idle);--cs:var(--idle-soft)} .s-repair{--c:var(--warn);--cs:var(--warn-soft)} .s-missing{--c:var(--bad);--cs:var(--bad-soft)} .s-disposed{--c:var(--muted);--cs:var(--sunk)}
.dot{background:var(--c)}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--cs);color:var(--c);border-radius:999px;padding:2px 9px;font-size:12.5px;font-weight:600;white-space:nowrap}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.toolbar input,.toolbar select{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:7px 10px}
.toolbar input{flex:1 1 220px;min-width:0}
.ledger-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table.ledger{width:100%;border-collapse:collapse;font-size:14px;min-width:760px}
.ledger th{text-align:left;font-family:var(--f-display);font-stretch:85%;font-weight:700;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.ledger td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.ledger tr:last-child td{border-bottom:0}
.ledger tbody tr{cursor:pointer}
.ledger tbody tr:hover td{background:var(--sunk)}
.ledger .chk{width:36px}
.tagchip{font-family:var(--f-mono);font-weight:600;font-size:13px;background:var(--tag);color:var(--tag-ink);padding:2px 7px;border-radius:3px;white-space:nowrap;letter-spacing:.02em}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.stale{color:var(--warn)}

.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:32px 24px;display:grid;gap:12px;justify-items:start;max-width:640px}
.empty h3{margin:0;font-family:var(--f-display);font-stretch:85%;font-size:20px}
.empty p{margin:0;color:var(--muted);max-width:60ch}
.steps{margin:0;padding-left:20px;color:var(--muted);display:grid;gap:4px}

/* Overlays */
.scrim{position:fixed;inset:0;background:rgb(10 12 14 / .45);z-index:40;display:flex;justify-content:flex-end}
.sheet{background:var(--bg);width:min(520px,100%);height:100%;overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 18px) 20px calc(env(safe-area-inset-bottom,0px) + 30px);display:flex;flex-direction:column;gap:16px;box-shadow:-10px 0 40px rgb(0 0 0 / .2)}
.modal-scrim{align-items:center;justify-content:center;padding:16px}
.modal{background:var(--bg);width:min(560px,100%);max-height:92%;overflow:auto;border-radius:10px;padding:20px;display:flex;flex-direction:column;gap:14px}
.sheet-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.sheet h3,.modal h3{margin:0;font-family:var(--f-display);font-stretch:85%;font-size:22px;line-height:1.15}
.label-card{display:grid;grid-template-columns:112px 1fr;gap:14px;align-items:center;background:linear-gradient(135deg,var(--tag),var(--surface));border:1px solid var(--line);border-radius:8px;padding:14px}
.label-card .qr{background:#fff;padding:6px;border-radius:4px;line-height:0}
.label-card .qr svg{width:100px;height:100px}
.label-card.notag{grid-template-columns:1fr}.label-card .big{font-family:var(--f-mono);font-weight:600;font-size:22px;letter-spacing:.04em}
dl.facts{display:grid;grid-template-columns:max-content 1fr;gap:6px 16px;margin:0;font-size:14px}
dl.facts dt{color:var(--muted)}
dl.facts dd{margin:0;min-width:0;overflow-wrap:anywhere}
.verify{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.log{list-style:none;margin:0;padding:0;display:grid;gap:8px;font-size:13.5px}
.log li{display:grid;grid-template-columns:auto 1fr;gap:10px}
.log time{font-family:var(--f-mono);font-size:12px;color:var(--muted);white-space:nowrap}
form.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
form.grid .full{grid-column:1/-1}
.field{display:grid;gap:4px;min-width:0}
.field label{font-size:12.5px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:8px 10px;width:100%;min-width:0}
.field textarea{min-height:72px;resize:vertical}
.hint{font-size:12.5px;color:var(--muted)}
.row-end{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
pre.sample{background:var(--sunk);border-radius:var(--r);padding:10px;font-family:var(--f-mono);font-size:12px;overflow-x:auto;margin:0}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:var(--r);z-index:60;max-width:calc(100% - 32px);font-size:14px;box-shadow:0 6px 24px rgb(0 0 0 / .25)}
.selbar{position:sticky;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);align-self:center;display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--ink);color:var(--bg);padding:8px 10px 8px 16px;border-radius:999px;box-shadow:0 8px 28px rgb(0 0 0 / .25)}
.selbar .btn{border-radius:999px}
.label-card.void .qr{opacity:.18;filter:grayscale(1)}.label-card.void .big{text-decoration:line-through;opacity:.6}
.docfile{display:inline-block;max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:middle;font-size:12.5px;color:var(--accent);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:2px 10px;margin:2px 4px 2px 0}.tabs{overflow-x:auto;scrollbar-width:none}
.holist{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.holist>li{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px}
.holist>li.off{opacity:.55}.holist>li.off .hophoto{filter:grayscale(1)}
.hophoto{position:relative}.hoimg{width:96px;height:96px;object-fit:cover;border-radius:8px;display:block;background:var(--sunk)}
.hoimg.none{display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--muted);text-align:center}
.hotag{position:absolute;left:4px;bottom:4px;font-size:10px;background:rgb(0 0 0/.62);color:#fff;padding:1px 5px;border-radius:4px}
.hobody{display:grid;gap:6px;min-width:0}.horow{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.holist input:not([type=checkbox]):not([type=file]),.holist select,.hogrid input{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:7px 9px;min-width:0}
.horow input:not([type=checkbox]),.horow select{flex:1 1 140px;width:0;min-width:110px;max-width:100%}.hobody>*{min-width:0}
.hogrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}.hogrid figure{margin:0;position:relative;display:grid;gap:4px}
.hogrid .hoimg{width:100%;height:130px}.hogrid [data-rrm]{position:absolute;top:4px;right:4px;background:var(--surface)}
.hosig{max-height:64px;max-width:200px;background:#fff;border-radius:6px;padding:4px}.flag.okflag{background:var(--ok-soft)}
.docfile.new{color:var(--ink)}.st-sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}.st-sum>div{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;background:var(--surface)}.st-sum b{display:block;font-size:24px;line-height:1.1}.st-sum b small{font-size:14px;color:var(--muted);font-weight:600}.st-sum span{font-size:13px;color:var(--muted)}.st-sum .bad{border-color:var(--bad);background:var(--bad-soft)}.st-sum .bad b{color:var(--bad)}.st-sum .warn{border-color:var(--warn);background:var(--warn-soft)}.docrow{display:flex;align-items:center;gap:4px}

.check{display:flex;gap:8px;align-items:center;cursor:pointer}
.report-list{margin:0;padding-left:20px;color:var(--muted);font-size:14px;display:grid;gap:3px}
.relabel{font-family:var(--f-display);font-stretch:85%;font-weight:700;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;background:var(--warn-soft);color:var(--warn);padding:2px 6px;border-radius:3px;margin-left:6px;white-space:nowrap}
.flag{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;background:var(--warn-soft);color:var(--ink);border-radius:var(--r);padding:10px 12px;font-size:14px}
.flag b{color:var(--warn)}
.unit-list li.sep{border-top:1px solid var(--line);margin:6px 4px}
.unit-list .code.warn{background:var(--warn-soft);color:var(--warn)}
.choice{display:grid;gap:8px}
.choice label{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:10px 12px;cursor:pointer}
.choice label:has(input:checked){border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.choice small{display:block;color:var(--muted)}
.meter{height:8px;background:var(--sunk);border-radius:99px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .2s}
.st-count{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.st-count .big{font-family:var(--f-display);font-stretch:85%;font-weight:800;font-size:30px;font-variant-numeric:tabular-nums}
.st-scan{display:flex;flex-wrap:wrap;gap:8px}
.st-scan input{flex:1 1 180px;min-width:0;border:2px solid var(--line);background:var(--surface);border-radius:var(--r);padding:10px 12px;font-family:var(--f-mono);font-size:16px}
.st-scan input:focus{border-color:var(--accent);outline:none}
.st-scan .btn{padding:10px 14px}
.st-log li{align-items:start}
.st-log .res{font-weight:600}
.st-log .ok{color:var(--ok)} .st-log .bad{color:var(--bad)} .st-log .warn{color:var(--warn)}
details.notfound{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
details.notfound summary{cursor:pointer;font-weight:600}
details.notfound ul{list-style:none;padding:0;margin:10px 0;display:grid;gap:6px;font-size:14px;max-height:220px;overflow:auto}
/* catalogue, inventories */
.thc{width:52px;padding-right:0!important}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tabs button{all:unset;cursor:pointer;padding:8px 14px;font-weight:600;font-size:14px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.lmoves{display:grid;gap:2px;margin-top:3px;font-size:12px}
.lmoves .mv{color:var(--warn)}.lmoves .dp{color:var(--muted)}
.st-move{padding:3px 10px;font-size:12.5px;margin-left:6px}
.xtag{margin:0 2px 2px 0}
.athumb{width:40px!important;height:40px!important;border-radius:6px;object-fit:cover;display:block;background:var(--sunk)}
.athumb.cat{opacity:.75}
.athumb.none{border:1px dashed var(--line);background:transparent}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
#detail .gallery .hint{font-size:12.5px}
.unit-list li.prop button{grid-template-columns:auto 1fr auto;font-weight:600;margin-top:4px}
.unit-list li.prop .chev{font-size:11px;color:var(--muted);width:14px;text-align:center}
.unit-list li.sub button{padding-left:22px}
.ledger tr.grp th{background:var(--sunk);text-transform:none;letter-spacing:0;font-family:var(--f-body);font-size:13.5px;color:var(--ink);cursor:pointer}
.newprops{display:grid;gap:8px;margin-bottom:10px}
.pcode{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--line);border-radius:var(--r);padding:6px 10px;background:var(--surface)}
.pcode input{width:90px;font-family:var(--f-mono);font-weight:600;border:1px solid var(--line);border-radius:6px;padding:5px 8px;background:var(--bg);text-transform:uppercase}
.unit-list .code.nav{background:var(--accent-soft);color:var(--accent)}
.check.small{font-size:13.5px;color:var(--muted);white-space:nowrap}
.sw{display:inline-flex;align-items:center;gap:6px;font-size:13px}
.sw i{width:12px;height:12px;border-radius:50%;border:1px solid var(--line);flex:none}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.pcard{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;min-width:0}
.pcard:hover{border-color:var(--muted)}
.pcard:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pcard.arch{opacity:.6}
.pimg{aspect-ratio:4/3;background:var(--sunk);display:grid;place-items:center;overflow:hidden;max-width:100%}
.pimg img{width:100%;height:100%;object-fit:cover;display:block}
.noimg{display:grid;place-items:center;width:100%;height:100%;font-family:var(--f-display);font-stretch:80%;font-weight:800;font-size:30px;color:var(--muted);letter-spacing:.04em;background:repeating-linear-gradient(135deg,var(--sunk) 0 10px,var(--bg) 10px 20px)}
img.broken{visibility:hidden}

<script>
/* Google bridge: provides the same db / user / downloads / assets functions the app uses, backed by the Google Sheet.
   All records (except item history) are mirrored in the browser, so screens are instant; writes are queued and saved in
   batches, and changes from colleagues arrive every 20 seconds. */
(function(){
const APP_URL=location.origin+location.pathname;
const LS=k=>{try{return localStorage.getItem("twc_"+k)||""}catch(e){return ""}};
const LSset=(k,v)=>{try{localStorage.setItem("twc_"+k,v)}catch(e){}};
const API=window.TWC_API;
async function call(fn,...args){
  let r;
  for(let t=0;;t++){
    try{r=await fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({fn,args}),redirect:"follow"});break}
    catch(e){if(t>=2) throw new Error("Can't reach the server. Check your internet connection and try again.");await new Promise(z=>setTimeout(z,800*(t+1)))}
  }
  if(!r.ok) throw new Error("The server answered with an error ("+r.status+"). Please try again.");
  let j;try{j=await r.json()}catch(e){throw new Error("The server sent an unexpected answer. Please try again.")}
  if(!j.ok) throw new Error(j.error||"Server error");
  return j.result;
}
const clone=o=>o===undefined?undefined:JSON.parse(JSON.stringify(o));
const COLS=["units","properties","assets","products","vendors","inventories","transfers","counters","documents","stocktakes","handovers"];
const M={};COLS.forEach(c=>M[c]=new Map());
let serverTime=0,code=LS("code");
const listeners=new Set();          // {kind,col,path,q,cb}
const pending=new Set();            // paths with unsaved writes
let queue=[],flushing=false;

/* ---------- gate: access code + your name ---------- */
const gate=document.createElement("div");gate.id="gate";gate.hidden=true;document.body.appendChild(gate);
const gateHtml=(title,text,inputId,ph,btn,err,type)=>`<div class="gate-card"><span class="eyebrow">TWC</span><h2>${title}</h2><p>${text}</p>
  <form id="gateForm"><input id="${inputId}" placeholder="${ph}" ${type?`type="${type}"`:""} autocomplete="off" required><button class="btn primary" type="submit">${btn}</button></form>${err?`<p class="gate-err">${err}</p>`:""}</div>`;
function askCode(err){return new Promise(res=>{gate.hidden=false;
  gate.innerHTML=gateHtml("Assets & Inventory","Enter your company access code. You only need to do this once on this device.","gateIn","Access code","Continue",err,"password");
  const i=gate.querySelector("#gateIn");i.focus();gate.querySelector("#gateForm").onsubmit=e=>{e.preventDefault();gate.hidden=true;res(i.value.trim())}})}
function askName(){return new Promise(res=>{gate.hidden=false;
  gate.innerHTML=gateHtml("Your name","Shown in each item's history, so colleagues know who added, moved or checked it.","gateIn","e.g. Tan Wei Ling","Start");
  const i=gate.querySelector("#gateIn");i.focus();gate.querySelector("#gateForm").onsubmit=e=>{e.preventDefault();const v=i.value.trim();if(!v) return;gate.hidden=true;res(v)}})}

async function boot(){
  const slow=setTimeout(()=>{const c=document.getElementById("connState");if(c&&gate.hidden&&/connecting/.test(c.textContent)){gate.hidden=false;gate.innerHTML=`<div class="gate-card"><h2>Still connecting…</h2><p>The server hasn't answered after 25 seconds. Check your internet connection, then try again. The first load of the day can be slow.</p><button class="btn primary" onclick="location.reload()">Try again</button></div>`}},25000);
  for(;;){
    try{const r=await call("apiBoot",code);load(r);LSset("code",code);break}
    catch(e){if(/ACCESS_DENIED/.test(String(e&&e.message||e))){code=await askCode(code?"That code isn't right. Please try again.":"");continue}
      gate.hidden=false;gate.innerHTML=`<div class="gate-card"><h2>Couldn't load the register</h2><p>${String(e&&e.message||e)}</p><button class="btn primary" onclick="location.reload()">Try again</button></div>`;throw e}
  }
  clearTimeout(slow);gate.hidden=true;
  if(!LS("name")) LSset("name",await askName());
  setInterval(()=>{if(!document.hidden) sync()},20000);
  document.addEventListener("visibilitychange",()=>{if(!document.hidden) sync()});
  window.addEventListener("beforeunload",e=>{if(queue.length||flushing){e.preventDefault();e.returnValue=""}});
}
function load(r){COLS.forEach(c=>{M[c]=new Map();(r.data[c]||[]).forEach(d=>M[c].set(d.id,d.data))});serverTime=r.serverTime;notify(new Set(COLS))}
async function sync(){
  try{const r=await call("apiSync",code,serverTime);serverTime=r.serverTime;const touched=new Set();
    r.changes.forEach(ch=>{const path=ch.col+"/"+ch.id;if(pending.has(path)) return;
      if(ch.deleted) M[ch.col].delete(ch.id);else M[ch.col].set(ch.id,ch.data);touched.add(ch.col)});
    if(touched.size) notify(touched);
  }catch(e){if(/ACCESS_DENIED/.test(String(e&&e.message||e))){LSset("code","");location.reload()}}
}

/* ---------- queries over the local mirror ---------- */
const cmp=(a,b)=>a===b?0:(a===undefined||a===null)?-1:(b===undefined||b===null)?1:a<b?-1:1;
function runQ(q){
  let rows=[...M[q.col].entries()].map(([id,d])=>({id,d}));
  q.where.forEach(([f,op,v])=>{rows=rows.filter(({d})=>{const x=d[f];
    switch(op){case"==":return x===v;case"!=":return x!==v;case"<":return x<v;case"<=":return x<=v;case">":return x>v;case">=":return x>=v;
      case"in":return Array.isArray(v)&&v.includes(x);case"not-in":return Array.isArray(v)&&!v.includes(x);case"array-contains":return Array.isArray(x)&&x.includes(v);default:return true}})});
  if(q.order){const [f,dir]=q.order;rows.sort((a,b)=>cmp(a.d[f],b.d[f])*(dir==="desc"?-1:1))}
  if(q.lim) rows=rows.slice(0,q.lim);
  const docs=rows.map(r=>snapOf(r.id,r.d));
  return {docs,size:docs.length,empty:!docs.length,docChanges:()=>[],metadata:{fromCache:false,hasPendingWrites:false}};
}
const snapOf=(id,d)=>({id,exists:d!==undefined,data:()=>clone(d),metadata:{fromCache:false,hasPendingWrites:false}});
function notify(cols){listeners.forEach(l=>{if(l.dead) return;
  if(l.kind==="q"&&cols.has(l.q.col)) setTimeout(()=>{if(!l.dead) l.cb(runQ(l.q))},0);
  if(l.kind==="d"&&cols.has(l.col)) setTimeout(()=>{if(!l.dead) l.cb(snapOf(l.id,M[l.col].get(l.id)))},0);
  if(l.kind==="log"&&cols.has("log:"+l.tag)) l.refresh();})}

/* ---------- writes: applied locally at once, saved to the sheet in batches ---------- */
function enqueue(op,path,data){queue.push({op,path,data:clone(data)});pending.add(path);status();if(!flushing) setTimeout(flush,60)}
async function flush(){
  if(flushing||!queue.length) return;flushing=true;status();
  const batch=queue.splice(0,80);
  try{const r=await call("apiWrite",code,batch);serverTime=Math.max(serverTime,0);
    batch.forEach(o=>{if(!queue.some(q=>q.path===o.path)) pending.delete(o.path)});
  }catch(e){
    queue=[];pending.clear();
    const msg=String(e&&e.message||e);toastMsg(/ACCESS_DENIED/.test(msg)?"Your access code has changed. Please reload.":"Couldn't save: "+msg+" The latest data has been reloaded.");
    try{load(await call("apiBoot",code))}catch(_){}
  }finally{flushing=false;status();if(queue.length) flush()}
}
function status(){const el=document.getElementById("connState");if(el) el.textContent=queue.length||flushing?"saving…":"saved";}
function toastMsg(m){const t=document.getElementById("toast");if(t){t.textContent=m;t.hidden=false;setTimeout(()=>t.hidden=true,6000)}}
function applyLocal(op,col,id,data){
  if(op==="delete") M[col].delete(id);
  else if(op==="update"){const cur=M[col].get(id);if(cur===undefined) throw {code:"invalid_argument",message:"Record not found"};M[col].set(id,{...cur,...clone(data)})}
  else M[col].set(id,clone(data));
  notify(new Set([col]));
}
const rid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,10);

/* ---------- item history (kept on the server, loaded on demand) ---------- */
const localLogs={};   // tag -> [{id,data}] written this session, shown before the server confirms
function logQuery(tag,order,lim){
  return {where:()=>logQuery(tag,order,lim),orderBy:(f,d)=>logQuery(tag,[f,d||"asc"],lim),limit:n=>logQuery(tag,order,n),
    get:async()=>logSnap(await fetchLogs(tag),order,lim),
    onSnapshot:(cb)=>{const l={kind:"log",tag,cb,dead:false};l.refresh=async()=>{try{const docs=await fetchLogs(tag);if(!l.dead) cb(logSnap(docs,order,lim))}catch(e){}};listeners.add(l);l.refresh();return ()=>{l.dead=true;listeners.delete(l)}},
    add:async d=>{const id=rid();(localLogs[tag]=localLogs[tag]||[]).push({id,data:clone(d)});enqueue("set",`assets/${tag}/log/${id}`,d);notify(new Set(["log:"+tag]));return docRef(`assets/${tag}/log/${id}`)},
    doc:id=>docRef(`assets/${tag}/log/${id||rid()}`)};
}
async function fetchLogs(tag){const srv=await call("apiLog",code,tag);const ids=new Set(srv.map(x=>x.id));return srv.concat((localLogs[tag]||[]).filter(x=>!ids.has(x.id)))}
function logSnap(list,order,lim){let rows=list.slice();if(order){const [f,dir]=order;rows.sort((a,b)=>cmp(a.data[f],b.data[f])*(dir==="desc"?-1:1))}if(lim) rows=rows.slice(0,lim);
  const docs=rows.map(r=>snapOf(r.id,r.data));return {docs,size:docs.length,empty:!docs.length,docChanges:()=>[],metadata:{}}}

/* ---------- the db object the app uses ---------- */
function parse(path){const p=String(path).split("/");if(p.length===2&&M[p[0]]) return {col:p[0],id:p[1]};throw {code:"invalid_argument",message:"Unsupported path "+path}}
function docRef(path){
  const p=String(path).split("/");
  if(p.length===4&&p[0]==="assets"&&p[2]==="log"){return {id:p[3],path,get:async()=>snapOf(p[3],undefined),set:async d=>enqueue("set",path,d),update:async()=>{},delete:async()=>enqueue("delete",path)}}
  const {col,id}=parse(path);
  return {id,path,
    get:async()=>snapOf(id,M[col].get(id)),
    set:async d=>{applyLocal("set",col,id,d);enqueue("set",path,d)},
    update:async d=>{applyLocal("update",col,id,d);enqueue("update",path,d)},
    delete:async()=>{applyLocal("delete",col,id);enqueue("delete",path)},
    onSnapshot:(cb)=>{const l={kind:"d",col,id,cb,dead:false};listeners.add(l);setTimeout(()=>{if(!l.dead) cb(snapOf(id,M[col].get(id)))},0);return ()=>{l.dead=true;listeners.delete(l)}},
    collection:sub=>collRef(path+"/"+sub)};
}
function query(col,where,order,lim){
  const q={col,where,order,lim};
  return {path:col,where:(f,op,v)=>query(col,[...where,[f,op,v]],order,lim),orderBy:(f,d)=>query(col,where,[f,d||"asc"],lim),limit:n=>query(col,where,order,n),
    get:async()=>runQ(q),
    onSnapshot:(cb)=>{const l={kind:"q",q,cb,dead:false};listeners.add(l);setTimeout(()=>{if(!l.dead) cb(runQ(q))},0);return ()=>{l.dead=true;listeners.delete(l)}},
    doc:id=>docRef(col+"/"+(id||rid())),
    add:async d=>{const id=rid();await docRef(col+"/"+id).set(d);return docRef(col+"/"+id)}};
}
function collRef(path){const p=String(path).split("/");
  if(p.length===3&&p[0]==="assets"&&p[2]==="log") return logQuery(p[1]);
  if(p.length===1&&M[p[0]]) return query(p[0],[],null,0);
  throw {code:"invalid_argument",message:"Unsupported collection "+path}}
const db={doc:docRef,collection:collRef};

/* ---------- user: identified by the name entered on this device ---------- */
const user={id:async()=>"n:"+LS("name"),name:async()=>LS("name"),me:async()=>({id:"n:"+LS("name"),name:LS("name")}),
  can:async()=>true,canEdit:async()=>true,isOwner:async()=>true,
  profiles:async ids=>Object.fromEntries((ids||[]).map(i=>[i,{id:i,name:String(i).startsWith("n:")?String(i).slice(2):""}]))};

/* ---------- photos in Google Drive ---------- */
const blobToDataUrl=b=>new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=rej;fr.readAsDataURL(b)});
const assets={upload:async(blob)=>{const id=await call("apiUploadPhoto",code,await blobToDataUrl(blob));return {id,url:window.photoUrl?window.photoUrl(id):"",sizeBytes:blob.size,contentType:blob.type}},
  delete:async id=>({deleted:await call("apiDeletePhoto",code,id)}),list:async()=>({assets:[],usage:{}})};
const photoCache={};
window.photoData=id=>photoCache[id]=photoCache[id]||call("apiPhotoData",code,id);
window.uploadDocFile=async f=>{if(f.size>15*1024*1024) throw new Error(f.name+" is larger than 15 MB. Please use a smaller file.");return call("apiUploadDoc",code,f.name,(await blobToDataUrl(f)).split(",")[1],f.type||"application/octet-stream")};
window.deleteDocFile=id=>call("apiDeletePhoto",code,id);
window.twcCall=(fn,...a)=>call(fn,code,...a);window.twcSync=()=>sync();
window.twcFlush=async()=>{for(let i=0;i<400&&(queue.length||flushing);i++){if(!flushing) await flush();else await new Promise(r=>setTimeout(r,150))}if(queue.length) throw new Error("Changes are still saving. Please try again.")};

/* ---------- downloads: label sheets open in a new tab, files are saved to Google Drive ---------- */
const dlbar=document.createElement("div");dlbar.id="dlbar";dlbar.hidden=true;document.body.appendChild(dlbar);
function showDl(html){dlbar.innerHTML=html+`<button type="button" class="btn ghost" id="dlClose" aria-label="Close">✕</button>`;dlbar.hidden=false;dlbar.querySelector("#dlClose").onclick=()=>dlbar.hidden=true}
const downloads={save:async({filename,data})=>{
  if(/\.html?$/i.test(filename)){
    let w=null;try{w=window.open("","_blank")}catch(e){}
    if(w&&w.document){w.document.open();w.document.write(String(data));w.document.close();return {status:"saved"}}
    const url=URL.createObjectURL(new Blob([String(data)],{type:"text/html"}));
    showDl(`<span>Your label sheet is ready.</span><a class="btn primary" href="${url}" target="_blank" rel="noopener">Open label sheet</a>`);return {status:"saved"};
  }
  const blob=data instanceof Blob?data:new Blob([data]);
  filename=String(filename).replace(/\s*·\s*/g," - ").replace(/[\/:*?"<>|]/g,"-");
  const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>a.remove(),1500);
  setTimeout(()=>URL.revokeObjectURL(url),120000);
  const safe=filename.replace(/[<>&]/g,"");
  showDl(`<span><b>${safe}</b> downloaded.</span><a class="btn" href="${url}" download="${safe.replace(/"/g,"")}">Download again</a><button type="button" class="btn" id="dlDrive">Also save to Drive</button>`);
  dlbar.querySelector("#dlDrive").onclick=async e=>{const b=e.currentTarget;b.disabled=true;b.textContent="Saving…";
    try{const mime=/\.xlsx$/i.test(filename)?"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet":/\.csv$/i.test(filename)?"text/csv":"application/octet-stream";
      const r=await call("apiSaveFile",code,filename,(await blobToDataUrl(blob)).split(",")[1],mime);
      showDl(`<span><b>${safe}</b> saved to Drive.</span><a class="btn primary" href="${r.viewUrl}" target="_blank" rel="noopener">Open in Drive</a>`)}
    catch(err){b.disabled=false;b.textContent="Also save to Drive";toastMsg("Couldn't save to Drive: "+err.message)}};
  return {status:"saved"};
}};

const ready=boot();
window.claude={use:async name=>{await ready;return ({db,user,downloads,assets})[name]||null}};
window.TWC_APP_URL=APP_URL;
})();

</script>
<script>
// Link each QR label opens. Set after first publish.
const ARTIFACT_URL = location.origin + location.pathname;

const CATEGORIES = ["Furniture","Plants","IT equipment","Appliances","Fixtures & fittings","Other"];
const STATUSES = [
  {v:"In use",cls:"s-inuse"},{v:"In storage",cls:"s-storage"},{v:"Under repair",cls:"s-repair"},
  {v:"Missing",cls:"s-missing"},{v:"Disposed",cls:"s-disposed"}];
const CONDITIONS = ["New","Good","Fair","Poor"];
const statusCls = s => (STATUSES.find(x=>x.v===s)||STATUSES[0]).cls;

const S = {db:null,user:null,dl:null,me:null,canWrite:true,units:[],unit:null,assets:[],unsubAssets:null,
  filter:{q:"",status:"",cat:""},selected:new Set(),pendingTag:null,names:{},view:null,reprint:[],
  assetsCap:null,products:null,vendors:null,invDocs:null,cat:null,invs:null,
  pf:{q:"",category:"",type:"",brand:"",colour:"",vendor:"",archived:false},invFilter:{unit:"",status:""},edit:null,dirty:false,
  props:[],prop:null,collapsed:{}};

const $ = s => document.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtDate = ms => ms ? new Date(ms).toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"}) : "";
const fmtDT = ms => ms ? new Date(ms).toLocaleString(undefined,{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}) : "";
const daysAgo = ms => ms ? Math.floor((Date.now()-ms)/864e5) : null;
let toastT;
function toast(msg){const t=$("#toast");t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,3200)}
function writeErr(e){console.error(e);toast(e && (e.code==="not_granted"||/permission|denied/i.test(e.message||""))?"You have view-only access, so changes can't be saved.":"Couldn't save: "+(e?.message||"unknown error"))}

const localDay=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
/* ---------- Tag format: TWC-TBL-0001 (tables, desks), TWC-CHR-0001 (chairs), TWC-MSC-0001 (everything else) ---------- */
const COMPANY_CODE="TWC";
const tagPart=(v,n)=>String(v||"").toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,n);
function tagPrefix(brand,model,fallback){return [COMPANY_CODE,tagPart(brand,10)||"GEN",tagPart(model,12)||tagPart(fallback,12)||"ITEM"].join("-")}
/** Product type code for new tags, worked out from the asset type (or the name when no type is set). */
function typeCode(type,name){const pick=s=>/chair/.test(s)?"CHR":/table|desk/.test(s)?"TBL":"";const t=String(type||"").toLowerCase();
  return (t?pick(t):pick(String(name||"").toLowerCase()))||"MSC"}
const typePrefix=(type,name)=>COMPANY_CODE+"-"+typeCode(type,name);
/** Next free tag for a prefix, using a shared counter so numbers keep counting up per product type. */
async function nextTagFor(prefix){
  const ref=S.db.doc("counters/"+prefix);
  let n=((await ref.get()).data()||{}).next||1;
  for(;;n++){const tag=`${prefix}-${String(n).padStart(4,"0")}`;if(!(await S.db.doc("assets/"+tag).get()).exists){await ref.set({prefix,next:n+1,updatedAt:Date.now()});return tag}}
}

/* ---------- Properties ---------- */
function propName(code){if(!code) return "No property";const p=S.props.find(x=>x.code===code);return p?p.name:code}
function unitLabel(code){const u=S.units.find(x=>x.code===code);if(!u) return code||"";return (u.property?propName(u.property)+" · ":"")+(u.name||code)}
function unitName(c){return unitLabel(c)}
function groupedUnits(list){
  const g={};(list||S.units).forEach(u=>{const k=u.property||"";(g[k]=g[k]||[]).push(u)});
  return Object.keys(g).sort((a,b)=>a===""?1:b===""?-1:propName(a).localeCompare(propName(b),undefined,{numeric:true}))
    .map(k=>({prop:k,name:propName(k),units:g[k].sort((a,b)=>String(a.name||a.code).localeCompare(String(b.name||b.code),undefined,{numeric:true}))}));
}
function unitOptions(sel,extra){
  return groupedUnits().map(g=>`<optgroup label="${esc(g.name)}">${g.units.map(u=>`<option value="${esc(u.code)}" ${sel===u.code?"selected":""}>${esc(u.name||u.code)}${extra?extra(u):""}</option>`).join("")}</optgroup>`).join("");
}
function propCodeFrom(name){return String(name||"").toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,6)||"P"}
function unitCodeFrom(name){
  const w=String(name||"").toUpperCase().replace(/[^A-Z0-9 ]/g," ").split(/\s+/).filter(Boolean);
  return (w.map(x=>/\d/.test(x)?x:x[0]).join("")||"U").slice(0,8);
}

/* ---------- QR ---------- */
function qrPayload(tag){return ARTIFACT_URL ? ARTIFACT_URL+"?tag="+encodeURIComponent(tag) : tag}
function qrSvg(text){
  if(typeof qrcode!=="function") return "";
  const q=qrcode(0,"M");q.addData(text);q.make();
  return q.createSvgTag({cellSize:4,margin:0,scalable:true});
}
function parseScan(raw){
  let s=String(raw||"").trim(); if(!s) return "";
  const m=s.match(/[?&#]tag=([^&#]+)/i);
  if(m) s=decodeURIComponent(m[1]); else { const h=s.lastIndexOf("#"); if(h>=0) s=s.slice(h+1); }
  return s.toUpperCase().replace(/\s+/g,"");
}

/* ---------- Units ---------- */
function renderUnits(){
  const f=$("#unitFilter").value.trim().toLowerCase();
  const list=S.units.filter(u=>!f||u.code.toLowerCase().includes(f)||(u.name||"").toLowerCase().includes(f)||propName(u.property).toLowerCase().includes(f));
  const total=S.units.reduce((a,u)=>a+(u.count||0),0);
  $("#unitList").innerHTML =
    `<li><button data-unit="" aria-current="${!S.unit&&!S.view&&!S.prop}"><span class="code">ALL</span><span class="nm">All properties</span><span class="ct">${total}</span></button></li>`+
    `<li><button data-unit="__products" aria-current="${S.view==="products"}"><span class="code nav">AST</span><span class="nm">Assets</span><span class="ct">${S.cat?S.cat.products.filter(p=>p.active).length:""}</span></button></li>`+
    `<li><button data-unit="__inventories" aria-current="${S.view==="inventories"||S.view==="inv-edit"||S.view==="documents"}"><span class="code nav">INV</span><span class="nm">Inventories</span><span class="ct">${S.invs?S.invs.length:""}</span></button></li>`+
    `<li><button data-unit="__transfers" aria-current="${S.view==="transfers"}"><span class="code nav">TRF</span><span class="nm">Transfers</span><span class="ct"></span></button></li>`+
    `<li><button data-unit="__reprint" aria-current="${S.view==="reprint"}"><span class="code warn">TAG</span><span class="nm">Labels to reprint</span><span class="ct">${S.reprint.length}</span></button></li><li class="sep" aria-hidden="true"></li>`+
    groupedUnits(list).map(g=>{const open=f||!S.collapsed[g.prop]||g.units.some(u=>u.code===S.unit);const n=g.units.reduce((a,u)=>a+(u.count||0),0);
      return `<li class="prop"><button data-prop="${esc(g.prop)}" aria-expanded="${!!open}" aria-current="${!S.unit&&!S.view&&S.prop===g.prop&&g.prop!==""}"><span class="chev" aria-hidden="true">${open?"▾":"▸"}</span><span class="nm">${esc(g.name)}</span><span class="ct">${n}</span></button></li>`+
      (open?g.units.map(u=>`<li class="sub"><button data-unit="${esc(u.code)}" aria-current="${S.unit===u.code}"><span class="code">${esc(u.unitCode||u.code)}</span><span class="nm">${esc(u.name)}</span><span class="ct">${u.count||0}</span></button></li>`).join(""):"")}).join("");
  $("#unitSelect").innerHTML=`<option value="">All units (${S.units.length})</option><option value="__products" ${S.view==="products"?"selected":""}>Assets</option><option value="__inventories" ${S.view==="inventories"||S.view==="inv-edit"||S.view==="documents"?"selected":""}>Inventories</option><option value="__transfers" ${S.view==="transfers"?"selected":""}>Transfers</option><option value="__reprint" ${S.view==="reprint"?"selected":""}>Labels to reprint (${S.reprint.length})</option>`+groupedUnits().map(g=>`<optgroup label="${esc(g.name)}">${g.prop?`<option value="__prop:${esc(g.prop)}" ${!S.unit&&!S.view&&S.prop===g.prop?"selected":""}>All of ${esc(g.name)}</option>`:""}${g.units.map(u=>`<option value="${esc(u.code)}" ${S.unit===u.code?"selected":""}>${esc(u.name)}</option>`).join("")}</optgroup>`).join("");
}
$("#unitList").addEventListener("click",e=>{
  const pb=e.target.closest("button[data-prop]");
  if(pb){const k=pb.dataset.prop;const isCur=!S.unit&&!S.view&&S.prop===k;
    if(isCur||k===""){S.collapsed[k]=!S.collapsed[k];renderUnits();return}
    S.collapsed[k]=false;selectUnit("__prop:"+k);return}
  const b=e.target.closest("button[data-unit]");if(b) selectUnit(b.dataset.unit||null)});
$("#unitSelect").addEventListener("change",e=>selectUnit(e.target.value||null));
$("#unitFilter").addEventListener("input",renderUnits);

function selectUnit(code,force){
  if(S.view==="handover"&&S.hoDirty&&!force){confirmDiscard(()=>{S.hoDirty=false;selectUnit(code,true)});renderUnits();return}
  S.ho=null;S.hoDirty=false;
  if(S.view==="inv-edit"&&S.dirty&&!force){confirmDiscard(()=>selectUnit(code,true));renderUnits();return}
  S.dirty=false;S.edit=null;
  S.selected.clear(); S.filter={q:"",status:"",cat:""};
  if(S.unsubAssets){S.unsubAssets();S.unsubAssets=null}
  S.prop=null;
  if(code&&code.startsWith("__prop:")){S.view=null;S.unit=null;S.prop=code.slice(7);S.assets=[];renderUnits();renderView();return}
  if(code==="__reprint"){S.view="reprint";S.unit=null;S.assets=[];renderUnits();renderView();return}
  if(code==="__documents"){S.view="documents";S.unit=null;S.assets=[];renderUnits();renderView();return}
  if(code==="__transfers"){S.view="transfers";S.unit=null;S.assets=[];S.transfers=null;renderUnits();renderView();return}
  if(code==="__products"||code==="__inventories"){S.view=code==="__products"?"products":"inventories";S.unit=null;S.assets=[];renderUnits();renderView();
    Promise.all([loadCatalog(),loadInvs()]).then(()=>{renderUnits();renderView()});return}
  S.view=null; S.unit=code;
  S.assets=[]; renderUnits(); renderView();
  if(code && S.db){
    S.assetsLoading=true;
    S.unsubAssets=S.db.collection("assets").where("unit","==",code).limit(1000).onSnapshot(snap=>{
      S.assetsLoading=false;
      S.assets=snap.docs.map(d=>d.data()).sort((a,b)=>a.tag.localeCompare(b.tag,undefined,{numeric:true}));
      renderView();
    },e=>{S.assetsLoading=false;toast("Couldn't load assets: "+e.message)});
  }
}

function openAddUnits(presetProp){
  const pre=presetProp?propName(presetProp)+", ":"";
  modal(`<h3>Add properties and units</h3>
   <p class="hint" style="margin:0">One unit per line: the <b>property</b>, a comma, then the <b>unit</b>. You can paste the whole list at once, for example from two spreadsheet columns. New properties are created automatically.</p>
   <div class="field"><label for="unitsText">Property, unit</label><textarea id="unitsText" rows="8" placeholder="1 KS, Workspace 11&#10;1 KS, Workspace 12&#10;Marina Hub, Suite 3A">${esc(pre)}</textarea></div>
   <div id="unitsPreview"></div>
   <div class="row-end"><button class="btn" data-close>Cancel</button><button class="btn primary" id="unitsSave" disabled>Add units</button></div>`);
  const ta=$("#unitsText"),pv=$("#unitsPreview"),btn=$("#unitsSave");
  const propCodes={},unitCodes={};   // edits the user makes in the preview
  let rows=[];
  const build=()=>{
    const lines=ta.value.split(/\n/).map(l=>l.trim()).filter(Boolean);
    const out=[],newProps={};
    const takenP=new Set(S.props.map(p=>p.code));
    for(const l of lines){
      const m=l.split(/\t|,|;/);const pn=(m[0]||"").trim(),un=m.slice(1).join(",").trim();
      if(!pn||!un){out.push({bad:"Needs both a property and a unit",line:l});continue}
      let prop=S.props.find(p=>p.name.toLowerCase()===pn.toLowerCase()||p.code===pn.toUpperCase());
      let pcode;
      if(prop) pcode=prop.code;
      else{
        const key=pn.toLowerCase();
        if(!newProps[key]){let c=propCodes[key]||propCodeFrom(pn),base=c,k=2;while(!propCodes[key]&&(takenP.has(c)||Object.values(newProps).some(x=>x.code===c))){c=(base+k++).slice(-6)}newProps[key]={name:pn,code:c}}
        pcode=newProps[key].code;
      }
      const ukey=pcode+"|"+un.toLowerCase();
      const existing=S.units.find(u=>u.property===pcode&&String(u.name).toLowerCase()===un.toLowerCase());
      let ucode=existing?existing.unitCode:(unitCodes[ukey]||unitCodeFrom(un));
      if(!existing&&!unitCodes[ukey]){let base=ucode,k=0;const clash=c=>S.units.some(u=>u.code===pcode+"-"+c)||out.some(r=>r.code===pcode+"-"+c);
        while(clash(ucode)) ucode=(base+String.fromCharCode(66+k++)).slice(0,8)}
      out.push({pname:prop?prop.name:newProps[pn.toLowerCase()].name,pcode,isNewProp:!prop,uname:un,ucode,ukey,code:pcode+"-"+ucode,existing:!!existing});
    }
    rows=out;
    const np=Object.entries(newProps);
    const badCode=r=>!r.bad&&(!/^[A-Z0-9]{1,6}$/.test(r.pcode)||!/^[A-Z0-9]{1,8}$/.test(r.ucode));
    const dupCode=r=>!r.bad&&!r.existing&&(S.units.some(u=>u.code===r.code)||rows.filter(x=>x.code===r.code).length>1);
    const ok=rows.filter(r=>!r.bad&&!badCode(r)&&!dupCode(r));
    pv.innerHTML=!rows.length?"":`
      ${np.length?`<div class="newprops"><span class="eyebrow">New propert${np.length===1?"y":"ies"}: short code</span>${np.map(([k,v])=>`<label class="pcode"><span>${esc(v.name)}</span><input data-pk="${esc(k)}" value="${esc(v.code)}" maxlength="6" aria-label="Code for ${esc(v.name)}"></label>`).join("")}</div>`:""}
      <div class="ledger-wrap" style="max-height:260px;overflow:auto"><table class="ledger" style="min-width:0"><thead><tr><th>Property</th><th>Unit</th><th>Unit code</th><th></th></tr></thead><tbody>
      ${rows.map((r,i)=>r.bad?`<tr><td colspan="4" class="stale">${esc(r.line)} — ${r.bad}</td></tr>`:`<tr><td>${esc(r.pname)}</td><td>${esc(r.uname)}${r.existing?' <span class="muted">(exists)</span>':""}</td>
        <td>${r.existing?`<span class="tagchip">${esc(r.ucode)}</span>`:`<input class="lin mono" style="width:90px" data-uk="${esc(r.ukey)}" value="${esc(r.ucode)}" maxlength="8" aria-label="Unit code for ${esc(r.uname)}">`}</td>
        <td class="mono ${badCode(r)||dupCode(r)?"stale":"muted"}">${badCode(r)?"Use letters and digits only":dupCode(r)?"Code already used":esc(r.code)}</td></tr>`).join("")}</tbody></table></div>
      <p class="hint" style="margin:6px 0 0">${ok.length} unit${ok.length===1?"":"s"} ready${np.length?` in ${np.length} new propert${np.length===1?"y":"ies"}`:""}. Codes are used inside the app to tell units apart and can't be changed later.</p>`;
    btn.disabled=!ok.filter(r=>!r.existing).length;
    rows.forEach(r=>r.ok=ok.includes(r));
  };
  pv.addEventListener("change",e=>{
    const pk=e.target.dataset.pk,uk=e.target.dataset.uk,v=e.target.value.toUpperCase().replace(/[^A-Z0-9]/g,"");
    if(pk!==undefined){propCodes[pk]=v.slice(0,6);build()} if(uk!==undefined){unitCodes[uk]=v.slice(0,8);build()}
  });
  ta.addEventListener("input",build);build();ta.focus();ta.setSelectionRange(ta.value.length,ta.value.length);
  btn.onclick=async()=>{
    btn.disabled=true;btn.textContent="Saving…";let n=0;
    try{
      const madeProps=new Set();
      for(const r of rows){
        if(!r.ok||r.existing) continue;
        if(r.isNewProp&&!madeProps.has(r.pcode)&&!S.props.some(p=>p.code===r.pcode)){await S.db.doc("properties/"+r.pcode).set({code:r.pcode,name:r.pname,createdAt:Date.now()});madeProps.add(r.pcode)}
        if((await S.db.doc("units/"+r.code).get()).exists) continue;
        await S.db.doc("units/"+r.code).set({code:r.code,property:r.pcode,unitCode:r.ucode,name:r.uname,nextSeq:1,count:0,createdAt:Date.now()});n++;
      }
      closeOverlay();toast(`Added ${n} unit${n===1?"":"s"}`);
    }catch(e){btn.disabled=false;btn.textContent="Add units";writeErr(e)}
  };
}
function openProperties(){
  const list=groupedUnits().filter(g=>g.prop);
  modal(`<h3>Properties</h3>
   ${list.length?`<ul class="vlist">${S.props.slice().sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true})).map(p=>{const n=S.units.filter(u=>u.property===p.code).length;
     return `<li><button type="button" data-p="${esc(p.code)}"><b>${esc(p.name)}</b><span class="muted">Code ${esc(p.code)}${p.address?" · "+esc(p.address):""}</span><span class="vc">${n} unit${n===1?"":"s"}</span></button></li>`}).join("")}</ul>`:`<p class="muted" style="margin:0">No properties yet.</p>`}
   <div class="row-end"><button class="btn" data-close>Close</button><button class="btn primary" data-write id="ppAdd">+ Add properties and units</button></div>`);
  $("#ppAdd").onclick=()=>openAddUnits();

/** Wires a photo picker inside a form: returns {photos, busy()} */
function mountPhotoPicker(prefix,photos,saveBtn){
  let busy=0;
  const grid=$("#"+prefix+"grid"),add=$("#"+prefix+"Add"),input=$("#"+prefix+"Input"),st=$("#"+prefix+"Status");
  const draw=()=>{grid.innerHTML=photos.map((id,i)=>`<div class="ph">${photoImg(id,240)}<div class="phbar">${i?`<button type="button" data-main="${i}" title="Make main photo">★</button>`:`<span class="mainb">Main</span>`}<button type="button" data-rm="${i}" aria-label="Remove photo">✕</button></div></div>`).join("");
    if(input) add.hidden=photos.length>=6};
  draw();
  grid.onclick=e=>{const r=e.target.closest("[data-rm]"),m=e.target.closest("[data-main]");
    if(r){photos.splice(+r.dataset.rm,1);draw()} if(m){const [x]=photos.splice(+m.dataset.main,1);photos.unshift(x);draw()}};
  if(input) input.onchange=async e=>{
    const files=[...e.target.files].slice(0,6-photos.length);e.target.value="";
    for(const f of files){busy++;st.textContent=`Uploading ${busy} photo${busy>1?"s":""}…`;if(saveBtn) saveBtn.disabled=true;
      try{photos.push(await uploadPhoto(f));draw()}catch(err){console.error(err);toast(err&&err.message?err.message:"The photo couldn't be added.")}
      finally{busy--;st.textContent=busy?`Uploading ${busy}…`:"";if(saveBtn) saveBtn.disabled=busy>0}}
  };
  return {photos,busy:()=>busy>0};
}
function photoPickerHtml(prefix){
  return `<div class="field full"><span class="flabel">Photos <span class="hint">(up to 6; the first one is the main photo)</span></span>
      <div class="phgrid" id="${prefix}grid"></div>
      ${S.assetsCap?`<label class="btn" id="${prefix}Add" style="justify-self:start">+ Add photos<input type="file" id="${prefix}Input" accept="image/\x2a" multiple hidden></label>`:`<span class="hint" id="${prefix}Add">Photos can't be added right now. Please reload the page.</span>`}
      <span class="hint" id="${prefix}Status"></span></div>`;
}

/* ---------- Asset create / edit ---------- */
async function nextTag(code){
  const ref=S.db.doc("units/"+code);const snap=await ref.get();
  let seq=(snap.data()?.nextSeq)||1;
  for(let i=0;i<50;i++){
    const tag=`${code}-${String(seq).padStart(4,"0")}`;
    const ex=await S.db.doc("assets/"+tag).get();
    if(!ex.exists) return {tag,seq};
    seq++;
  }
  throw new Error("Couldn't find a free tag number");
}
async function bumpUnit(code,seq,delta){
  const ref=S.db.doc("units/"+code);const d=(await ref.get()).data()||{};
  await ref.update({nextSeq:Math.max(d.nextSeq||1,seq+1),count:Math.max(0,(d.count||0)+delta)});
}
async function logEvent(tag,text){
  try{await S.db.collection("assets/"+tag+"/log").add({at:Date.now(),by:S.me||null,text})}catch(e){console.warn(e)}
}

/* ---------- Asset detail ---------- */
let detailUnsubs=[];
async function openAsset(tag){
  if(!S.db){S.pendingTag=tag;return}
  const snap=await S.db.doc("assets/"+tag).get();
  if(!snap.exists){toast(`No tag ${tag} found. Showing search results instead.`);runSearch(tag);return}
  const a=snap.data();
  if(S.view!=="reprint" && S.unit!==a.unit) selectUnit(a.unit);
  await resolveNames([a.verifiedBy,a.disposedBy]);
  showDetail(a);
  detailUnsubs.push(S.db.doc("assets/"+tag).onSnapshot(async s=>{if(!s.exists||!$("#detail")) return;const d=s.data();await resolveNames([d.verifiedBy,d.disposedBy]);if($("#detail")) showDetail(d,true)}));
  detailUnsubs.push(S.db.collection("assets/"+tag+"/log").orderBy("at","desc").limit(25).onSnapshot(async s=>{
    const items=s.docs.map(d=>d.data());await resolveNames(items.map(i=>i.by));
    const el=$("#logList");if(el) el.innerHTML=items.map(i=>`<li><time>${fmtDT(i.at)}</time><span>${esc(i.text)} <span class="muted">· ${esc(nameOf(i.by))}</span></span></li>`).join("")||`<li class="muted">No history yet.</li>`;
  }));
}
function showDetail(a,update){
  const u=S.units.find(x=>x.code===a.unit);
  const d=daysAgo(a.verifiedAt);
  const html=`<div class="sheet" id="detail" role="dialog" aria-label="Asset ${esc(a.tag)}">
    <div class="sheet-head"><div><span class="eyebrow">${esc(unitLabel(a.unit))}</span><h3>${esc(a.name)}</h3></div><button class="btn ghost" data-close aria-label="Close">✕</button></div>

    ${a.needsLabel?`<div class="flag"><div><b>Label ${esc((a.labelIssue||"damaged").toLowerCase())}</b><div class="muted" style="font-size:13px">Reported ${esc(fmtDate(a.labelReportedAt))}${a.labelReportedBy?" by "+esc(nameOf(a.labelReportedBy)):""}${a.labelNote?" · "+esc(a.labelNote):""}</div></div><button class="btn" data-write id="relabelledBtn">New label attached</button></div>`:""}
    ${a.status==="Disposed"?`<div class="actions"><button class="btn primary" data-write id="undoDispBtn">Undo disposal</button><button class="btn ghost danger" data-write id="delBtn">Delete</button></div>`:""}<div class="actions"${a.status==="Disposed"?" hidden":""}><button class="btn primary" data-write id="xferBtn">Transfer</button><button class="btn" data-write id="editBtn">Edit</button>${S.assetsCap?`<label class="btn" data-write id="qPhotoBtn">Add photo<input type="file" id="qPhoto" accept="image/\x2a" capture="environment" hidden></label>`:""}<button class="btn" id="oneLabel">Download label</button>${a.needsLabel?"":`<button class="btn" data-write id="reportLabel">Report label problem</button>`}${a.status==="Disposed"?"":`<button class="btn danger" data-write id="dispBtn">Dispose</button><button class="btn ghost danger" data-write id="delBtn">Delete</button>`}</div>

      await S.db.doc("assets/"+a.tag).update({photos:[id,...cur].slice(0,6),updatedAt:Date.now(),updatedBy:S.me||null});

  };

function confirmDelete(a){
  modal(`<h3>Delete ${esc(a.tag)}?</h3><p style="margin:0">This removes <b>${esc(a.name)}</b> from the register. Only delete records made by mistake. If the item was sold, thrown away or donated, use <b>Dispose</b> instead: it keeps the record and its history.</p>
   <div class="row-end"><button class="btn" data-close>Keep it</button><button class="btn primary" id="markDisp">Dispose instead</button><button class="btn danger" id="reallyDel">Delete</button></div>`,true);
  $("#markDisp").onclick=()=>openDispose([a]);
  $("#reallyDel").onclick=async()=>{try{await S.db.doc("assets/"+a.tag).delete();if(a.status!=="Disposed") await bumpUnit(a.unit,0,-1);allItemsCache=null;
    if(S.assetsCap) for(const ph of a.photos||[]){try{await S.assetsCap.delete(ph)}catch(e){}}
    closeOverlay();toast(`${a.tag} deleted`)}catch(e){writeErr(e)}};
}

/* ---------- Disposal ---------- */
const DISPOSAL_METHODS=["Sold","Thrown away / scrapped","Donated","Returned to vendor","Recycled","Written off (lost or stolen)","Other"];
function openDispose(items){
  items=(items||[]).filter(a=>a&&a.status!=="Disposed");
  if(!items.length){toast("Those items are already disposed");return}
  const one=items.length===1;
  modal(`<h3>Dispose ${one?esc(items[0].tag):items.length+" items"}</h3>
   ${one?`<p style="margin:0">${esc(items[0].name)} <span class="muted">· ${esc(unitLabel(items[0].unit))}</span></p>`
     :`<ul class="report-list" style="max-height:140px;overflow:auto">${items.slice(0,12).map(a=>`<li><span class="tagchip">${esc(a.tag)}</span> ${esc(a.name)}</li>`).join("")}${items.length>12?`<li class="muted">and ${items.length-12} more</li>`:""}</ul>`}
   <div class="field"><label for="dpHow">How was it disposed? <span class="req">*</span></label><select id="dpHow"><option value="">Choose one</option>${DISPOSAL_METHODS.map(m=>`<option>${esc(m)}</option>`).join("")}</select></div>
   <div class="field"><label for="dpDate">Date disposed</label><input id="dpDate" type="date" value="${localDay()}" max="${localDay()}"></div>
   <div class="field"><label for="dpNote">Reason or note</label><input id="dpNote" placeholder="e.g. Broken frame, sold to staff for SGD 20, approved by facilities"></div>
   <p class="hint" style="margin:0">${one?"The item stays":"The items stay"} in the register with full history, marked Disposed. Disposed items no longer count in the unit, stock or stocktakes. Its label is deactivated: looking it up shows the item as disposed, and it can't be transferred, verified or reprinted. You can undo this later.</p>
   <div class="row-end"><button class="btn" data-close>Cancel</button><button class="btn danger" id="dpGo" disabled>Dispose</button></div>`);
  const how=$("#dpHow"),go=$("#dpGo");
  how.onchange=()=>{go.disabled=!how.value;go.textContent=one?"Dispose":`Dispose ${items.length} items`};
  go.onclick=async()=>{
    const method=how.value,date=$("#dpDate").value||localDay(),note=$("#dpNote").value.trim();if(!method) return;
    go.disabled=true;go.textContent="Disposing…";let n=0;
    try{
      for(const a of items){
        const cur=(await S.db.doc("assets/"+a.tag).get()).data();if(!cur||cur.status==="Disposed") continue;
        const now=Date.now();
        await S.db.doc("assets/"+a.tag).update({status:"Disposed",disposedFrom:cur.status,disposalMethod:method,disposedOn:date,disposalNote:note,disposedAt:now,disposedBy:S.me||null,needsLabel:false,updatedAt:now,updatedBy:S.me||null});
        await statusCountChange(cur.unit,cur.status,"Disposed");
        await logEvent(a.tag,`Disposed (${method})${date!==localDay()?" on "+fmtDate(Date.parse(date+"T00:00:00")):""}${note?" · "+note:""}`);
        n++;if(!one) go.textContent=`Disposing ${n} of ${items.length}…`;
      }
      S.selected.clear();closeOverlay();toast(one?`${items[0].tag} disposed`:`${n} items disposed`);
      if(one) setTimeout(()=>openAsset(items[0].tag),300);else renderView();
    }catch(e){go.disabled=false;go.textContent="Try again";writeErr(e)}
  };
}
function undoDispose(a){
  const to=a.disposedFrom&&a.disposedFrom!=="Disposed"?a.disposedFrom:"In use";
  modal(`<h3>Undo disposal of ${esc(a.tag)}?</h3><p style="margin:0">${esc(a.name)} goes back to <b>${esc(to)}</b> in ${esc(unitLabel(a.unit))}. Its label works again. The disposal stays in its history.</p>
   <div class="row-end"><button class="btn" data-close>Cancel</button><button class="btn primary" id="udGo">Undo disposal</button></div>`);
  $("#udGo").onclick=async()=>{const b=$("#udGo");b.disabled=true;
    try{await S.db.doc("assets/"+a.tag).update({status:to,disposedFrom:"",disposalMethod:"",disposedOn:"",disposalNote:"",disposedAt:null,disposedBy:null,updatedAt:Date.now(),updatedBy:S.me||null});
      await statusCountChange(a.unit,"Disposed",to);await logEvent(a.tag,`Disposal undone · back to ${to}`);
      closeOverlay();toast(`${a.tag} restored`);setTimeout(()=>openAsset(a.tag),300)}
    catch(e){b.disabled=false;writeErr(e)}};
}
function openBulkStatus(){
  modal(`<h3>Set status for ${S.selected.size} assets</h3><div class="field"><label for="bs">Status</label><select id="bs">${STATUSES.map(s=>`<option>${s.v}</option>`).join("")}</select></div>
   <div class="row-end"><button class="btn" data-close>Cancel</button><button class="btn primary" id="bsGo">Apply</button></div>`);
  $("#bsGo").onclick=async()=>{const st=$("#bs").value;const b=$("#bsGo");b.disabled=true;
    try{for(const tag of S.selected){const a=S.assets.find(x=>x.tag===tag);if(!a||a.status===st) continue;await S.db.doc("assets/"+tag).update({status:st,updatedAt:Date.now(),updatedBy:S.me||null});await statusCountChange(a.unit,a.status,st);await logEvent(tag,`Status ${a.status} → ${st}`)}
      closeOverlay();toast("Status updated");S.selected.clear();renderView()}catch(e){b.disabled=false;writeErr(e)}};
}

/* ---------- Documents (PO, DO, invoices) ---------- */
const DOC_TYPES=["Purchase order (PO)","Delivery order (DO)","Invoice","Quotation","Warranty","Receipt","Other"];
const docShort=t=>({"Purchase order (PO)":"PO","Delivery order (DO)":"DO"})[t]||t||"Doc";
const docUrl=f=>"https://drive.google.com/file/d/"+encodeURIComponent(f.id)+"/view";
const docDate=d=>d&&d.date?fmtDate(Date.parse(d.date+"T00:00:00")):"";
const fileChips=fs=>(fs||[]).map(f=>`<a class="docfile" href="${esc(docUrl(f))}" target="_blank" rel="noopener" title="${esc(f.name)}">${/pdf/i.test((f.mime||"")+f.name)?"PDF":/^image/i.test(f.mime||"")?"IMG":"FILE"} · ${esc(f.name)}</a>`).join("");
function docsFor(pred){return (S.docs||[]).filter(pred).sort((a,b)=>String(b.date||"").localeCompare(String(a.date||""))||String(b.id).localeCompare(String(a.id)))}
function invTabs(){const n=(S.docs||[]).length;
  return `<div class="tabs" role="tablist"><button role="tab" data-itab="inventories" aria-selected="${S.view!=="documents"}">Inventories${S.invs?` (${S.invs.length})`:""}</button><button role="tab" data-itab="documents" aria-selected="${S.view==="documents"}">Documents${n?` (${n})`:""}</button></div>`}
function wireInvTabs(){document.querySelectorAll("#view [data-itab]").forEach(b=>b.onclick=()=>{if(S.view===b.dataset.itab) return;S.view=b.dataset.itab;renderUnits();renderView()})}
function renderDocuments(v){
  if(!S.docs){v.innerHTML=`<div class="empty"><h3>Loading documents…</h3></div>`;return}
  const f=S.docFilter=S.docFilter||{q:"",type:"",unit:""},q=f.q.toLowerCase();
  const inScope=d=>!f.unit||(f.unit.startsWith("P:")?!!d.unit&&(S.units.find(u=>u.code===d.unit)||{}).property===f.unit.slice(2):d.unit===f.unit);
  const rows=docsFor(d=>(!f.type||d.type===f.type)&&inScope(d)&&(!q||[d.id,d.type,d.number,d.vendor,d.notes,d.inventory,d.unit?unitLabel(d.unit):"",...(d.files||[]).map(x=>x.name)].join(" ").toLowerCase().includes(q)));
  const keep=document.activeElement?.id==="docQ";
  v.innerHTML=`<div class="pagehead"><div><h2>Inventories</h2><div class="sub">Purchase orders, delivery orders, invoices and other paperwork, linked to units and inventories. <span class="num">${rows.length}</span> document${rows.length===1?"":"s"}</div></div>
    <div class="actions"><button class="btn primary" data-write id="docNew">+ Upload document</button></div></div>
    ${invTabs()}
    <div class="toolbar"><input id="docQ" placeholder="Search number, vendor, file name" value="${esc(f.q)}" aria-label="Search documents">
      <select id="docType" aria-label="Type"><option value="">All types</option>${DOC_TYPES.map(t=>`<option ${f.type===t?"selected":""}>${esc(t)}</option>`).join("")}</select>
      <select id="docUnit" aria-label="Property or unit"><option value="">All properties and units</option>${groupedUnits().map(g=>`<optgroup label="${esc(g.name)}">${g.prop?`<option value="P:${esc(g.prop)}" ${f.unit==="P:"+g.prop?"selected":""}>All of ${esc(g.name)}</option>`:""}${g.units.map(u=>`<option value="${esc(u.code)}" ${f.unit===u.code?"selected":""}>${esc(u.name)}</option>`).join("")}</optgroup>`).join("")}</select></div>
    ${rows.length?`<div class="ledger-wrap"><table class="ledger"><thead><tr><th>Date</th><th>Type</th><th>Number</th><th>Vendor</th><th>Unit</th><th>Inventory</th><th style="text-align:right">Amount</th><th>Files</th></tr></thead><tbody>
      ${rows.map(d=>`<tr data-doc="${esc(d.id)}"><td class="muted num" style="white-space:nowrap">${esc(docDate(d))}</td><td><span class="pill s-storage">${esc(docShort(d.type))}</span></td><td><b>${esc(d.number||d.id)}</b>${d.notes?`<div class="muted" style="font-size:12.5px">${esc(d.notes)}</div>`:""}</td><td>${esc(d.vendor||"")}</td><td>${d.unit?esc(unitLabel(d.unit)):`<span class="muted">—</span>`}</td><td>${d.inventory?`<span class="tagchip">${esc(d.inventory)}</span>`:""}</td><td class="num" style="text-align:right;white-space:nowrap">${d.amount!==""&&d.amount!=null?money(d.amount):""}</td><td>${fileChips(d.files)}</td></tr>`).join("")}
    </tbody></table></div>`:`<div class="empty"><h3>${S.docs.length?"No documents match":"No documents yet"}</h3><p>Upload purchase orders, delivery orders, invoices or warranties as a PDF or a photo. Link each one to a unit and inventory so it's easy to find for audits and move-outs.</p></div>`}`;
  const qi=$("#docQ");qi.oninput=e=>{f.q=e.target.value;renderView()};if(keep){qi.focus();qi.setSelectionRange(qi.value.length,qi.value.length)}
  $("#docType").onchange=e=>{f.type=e.target.value;renderView()};$("#docUnit").onchange=e=>{f.unit=e.target.value;renderView()};
  wireInvTabs();
  $("#docNew").onclick=()=>openDocForm(null,{unit:f.unit&&!f.unit.startsWith("P:")?f.unit:""});
  v.querySelector("tbody")?.addEventListener("click",e=>{if(e.target.closest("a")) return;const r=e.target.closest("tr[data-doc]");if(r) openDocForm(S.docs.find(x=>x.id===r.dataset.doc))});
  applyWriteGate();
}
function openDocForm(doc,pre){
  const isNew=!doc;pre=pre||{};
  const d=doc?JSON.parse(JSON.stringify(doc)):{type:pre.type||"Purchase order (PO)",number:"",date:localDay(),vendor:"",unit:pre.unit||"",inventory:pre.inventory||"",amount:"",notes:"",files:[]};
  const files=[...(d.files||[])],removed=[],picked=[];
  const invList=u=>{const l=(S.invs||[]).filter(i=>!u||i.unit===u);if(d.inventory&&(!u||u===d.unit)&&!l.some(i=>i.id===d.inventory)) l.push({id:d.inventory,name:S.edit&&S.edit.inv.id===d.inventory?S.edit.inv.name:"",unit:d.unit});return l};
  const invOpts=u=>invList(u).sort((a,b)=>b.id.localeCompare(a.id)).map(i=>`<option value="${esc(i.id)}" ${d.inventory===i.id?"selected":""}>${esc(i.id)} · ${esc(i.name)}${u?"":" · "+esc(unitLabel(i.unit))}</option>`).join("");
  modal(`<h3>${isNew?"Upload document":"Document "+esc(d.id)}</h3>

    <div class="field"><label for="dc-unit">Unit</label><select id="dc-unit"><option value="">Not linked to a unit</option>${unitOptions(d.unit)}</select></div>
    <div class="field"><label for="dc-inv">Inventory</label><select id="dc-inv"><option value="">Not linked</option>${invOpts(d.unit)}</select></div>
    <div class="field"><label for="dc-amt">Amount (${esc(S.cat?S.cat.currency:"SGD")})</label><input id="dc-amt" inputmode="decimal" value="${esc(d.amount)}" placeholder="Optional"></div>
    <div class="field"><label for="dc-notes">Notes</label><input id="dc-notes" value="${esc(d.notes)}" placeholder="e.g. 20 task chairs for level 3"></div>
    <div class="field full"><span class="flabel">Files <span class="hint">(PDF, photo, Word or Excel, up to 15 MB each)</span></span>
      <div id="dcFiles"></div>
      <div class="actions"><label class="btn" data-write>+ Add files<input type="file" id="dcInput" multiple accept=".pdf,image/\x2a,.doc,.docx,.xls,.xlsx,.csv" hidden></label>
      <label class="btn" data-write>Take photo<input type="file" id="dcCamIn" accept="image/\x2a" capture="environment" hidden></label></div>
      <span class="hint" id="dcStatus"></span></div>
    <div class="row-end full">${isNew?"":`<button class="btn ghost danger" type="button" data-write id="dcDel" style="margin-right:auto">Delete</button>`}<button class="btn" type="button" data-close>Cancel</button><button class="btn primary" type="submit" data-write id="dcSave">${isNew?"Upload":"Save"}</button></div>
   </form>`);
  const draw=()=>{$("#dcFiles").innerHTML=[...files.map((f,i)=>`<div class="docrow">${fileChips([f])}<button type="button" class="btn ghost" data-rmf="${i}" aria-label="Remove ${esc(f.name)}">✕</button></div>`),
    ...picked.map((f,i)=>`<div class="docrow"><span class="docfile new">${esc(f.name)} · ${Math.max(1,Math.round(f.size/1024)).toLocaleString()} KB</span><button type="button" class="btn ghost" data-rmp="${i}" aria-label="Remove ${esc(f.name)}">✕</button></div>`)].join("")
    ||`<p class="muted" style="margin:0 0 8px;font-size:13px">No files added yet.</p>`};

  const addPicked=e=>{const fs=[...e.target.files];e.target.value="";const big=fs.filter(f=>f.size>15*1024*1024);
    if(big.length) toast(`${big.map(f=>f.name).join(", ")} ${big.length===1?"is":"are"} over 15 MB, please use a smaller file`);picked.push(...fs.filter(f=>f.size<=15*1024*1024));draw()};
  $("#dcInput").onchange=addPicked;$("#dcCamIn").onchange=addPicked;
  $("#dc-unit").onchange=()=>{d.inventory=$("#dc-inv").value;$("#dc-inv").innerHTML=`<option value="">Not linked</option>${invOpts($("#dc-unit").value)}`};
  $("#dc-inv").onchange=e=>{const i=(S.invs||[]).find(x=>x.id===e.target.value);if(i&&!$("#dc-unit").value){$("#dc-unit").value=i.unit;d.inventory=i.id;$("#dc-inv").innerHTML=`<option value="">Not linked</option>${invOpts(i.unit)}`}};
  $("#dcf").onsubmit=async e=>{e.preventDefault();
    if(!files.length&&!picked.length){toast("Add the PDF or a photo of the document first");return}
    if(!window.uploadDocFile){toast("Document upload isn't available in this view");return}
    const b=$("#dcSave");b.disabled=true;
    try{
      const up=[];
      for(let i=0;i<picked.length;i++){$("#dcStatus").textContent=`Uploading ${i+1} of ${picked.length}…`;const r=await window.uploadDocFile(picked[i]);

function parseCsv(text){
  const rows=[];let row=[],f="",q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"') q=true; else if(c===","){row.push(f);f=""} else if(c==="\n"||c==="\r"){if(c==="\r"&&text[i+1]==="\n") i++;row.push(f);rows.push(row);row=[];f=""} else f+=c}
  if(f!==""||row.length){row.push(f);rows.push(row)}
  return rows.filter(r=>r.some(x=>x.trim()!==""));
}

async function statusCountChange(unit,from,to){
  S.stock=null;
  if(from!=="Disposed"&&to==="Disposed") await bumpUnit(unit,0,-1);
  else if(from==="Disposed"&&to!=="Disposed") await bumpUnit(unit,0,1);
  allItemsCache=null;

/* ---------- Transfers ---------- */
/** Moves tagged items to another unit, logs it on each item and records one transfer entry. */
async function transferItems(tags,to,location,note){
  if(!S.units.some(u=>u.code===to)) throw new Error("Please choose the unit to move to.");
  const moved=[],now=Date.now();
  for(const tag of tags){
    const ref=S.db.doc("assets/"+tag),a=(await ref.get()).data();
    if(!a||a.unit===to) continue;
    await ref.update({unit:to,location:location||"",updatedAt:now,updatedBy:S.me||null});
    await logEvent(tag,`Transferred from ${unitLabel(a.unit)} to ${unitLabel(to)}${location?" ("+location+")":""}${note?" · "+note:""}`);
    if(a.status!=="Disposed"){await bumpUnit(a.unit,0,-1);await bumpUnit(to,0,1)}
    moved.push({tag,name:a.name||"",from:a.unit,fromLocation:a.location||""});
  }
  if(moved.length) await S.db.collection("transfers").add({at:now,by:S.me||null,to,location:location||"",note:note||"",items:moved,
    fromUnits:[...new Set(moved.map(m=>m.from))]});
  allItemsCache=null;S.transfers=null;S.stock=null;
  return moved;
}
function openTransfer(items){
  items=(items||[]).filter(a=>a&&a.status!=="Disposed");if(!items.length){toast("Disposed items can't be transferred");return}
  const froms=[...new Set(items.map(a=>a.unit))];
  modal(`<h3>Transfer ${items.length===1?esc(items[0].tag):items.length+" items"}</h3>
   <ul class="report-list" style="max-height:140px;overflow:auto">${items.slice(0,12).map(a=>`<li><span class="tagchip">${esc(a.tag)}</span> ${esc(a.name)} <span class="muted">· now in ${esc(unitLabel(a.unit))}</span></li>`).join("")}${items.length>12?`<li class="muted">and ${items.length-12} more</li>`:""}</ul>
   <div class="field"><label for="xfTo">Move to <span class="req">*</span></label><select id="xfTo"><option value="">Choose a property and unit</option>${unitOptions("")}</select></div>
   <div class="field"><label for="xfLoc">New location in that unit</label><input id="xfLoc" placeholder="e.g. Level 3, desk 12 (leave blank if not known yet)"></div>

/* ---------- Current stock (follows transfers and disposals) ---------- */
/** Where every catalogue asset is right now: tagged items by their current unit, plus untagged pieces still listed in inventories. */
async function computeStock(force){
  const [items]=await Promise.all([loadAllItems(force),loadInvs()]);
  const origin={};
  (S.invDocs||[]).forEach(i=>(i.lines||[]).forEach(l=>tagList(l.tags).forEach(t=>origin[t]={inv:i.id,unit:i.unit,productId:l.productId})));
  const st={};
  const row=(u,p)=>{const k=u+"|"+p;return st[k]=st[k]||{unit:u,pid:p,here:0,tagged:0,untagged:0,movedIn:0,movedOut:0,disposed:0}};
  items.forEach(a=>{
    const o=origin[a.tag],pid=a.productId||(o&&o.productId)||"";if(!pid) return;
    if(a.status==="Disposed"){row(a.unit,pid).disposed++;return}
    const r=row(a.unit,pid);r.here++;r.tagged++;
    if(o&&o.unit!==a.unit){r.movedIn++;row(o.unit,pid).movedOut++}
  });
  (S.invDocs||[]).forEach(i=>(i.lines||[]).forEach(l=>{const un=Math.max(0,(+l.qty||0)-(+l.tagged||0));if(un){const r=row(i.unit,l.productId);r.here+=un;r.untagged+=un}}));
  S.stock=Object.values(st);S.origin=origin;
  if(S.cat) buildCat();
  return S.stock;
}
/** For one inventory line: how many of its tagged pieces are still here, moved away or disposed. */
function lineStatus(inv,l){
  const out={here:0,moved:0,disposed:0,unknown:0,where:{}};
  tagList(l.tags).forEach(t=>{const a=S.itemsByTag&&S.itemsByTag[t];
    if(!a){out.unknown++;return}
    if(a.status==="Disposed") out.disposed++;
    else if(a.unit!==inv.unit){out.moved++;out.where[a.unit]=(out.where[a.unit]||0)+1}
    else out.here++});
  return out;
}

let allItemsCache=null;
async function loadAllItems(force){
  if(allItemsCache&&!force&&Date.now()-allItemsCache.at<60000) return allItemsCache.items;
  const out=[];const units=[...S.units];
  for(let i=0;i<units.length;i+=8){
    const snaps=await Promise.all(units.slice(i,i+8).map(u=>S.db.collection("assets").where("unit","==",u.code).limit(1000).get().catch(()=>null)));
    snaps.forEach(sn=>sn&&sn.docs.forEach(d=>out.push(d.data())));
  }
  allItemsCache={at:Date.now(),items:out};
  S.itemsByTag={};out.forEach(a=>S.itemsByTag[a.tag]=a);
  // Keep each unit's item count in step with reality (disposed items don't count).
  if(S.canWrite){const live={};out.forEach(a=>{if(a.status!=="Disposed") live[a.unit]=(live[a.unit]||0)+1});
    for(const u of units){const n=live[u.code]||0;if((u.count||0)!==n){try{await S.db.doc("units/"+u.code).update({count:n})}catch(e){}}}}
  return out;
}
function runSearch(q){
  if(S.view==="inv-edit"&&S.dirty){confirmDiscard(()=>{S.dirty=false;runSearch(q)});return}
  if(S.unsubAssets){S.unsubAssets();S.unsubAssets=null}
  S.view="search";S.unit=null;S.prop=null;S.edit=null;S.q=String(q||"").trim();S.searchRes=null;
  $("#scanInput").value=S.q;closeOverlay();renderUnits();renderView();
  const my=S.q;
  Promise.all([loadCatalog(),loadAllItems()]).then(([,items])=>{if(S.view!=="search"||S.q!==my) return;
    const words=my.toLowerCase().split(/\s+/).filter(Boolean);
    const hit=hay=>words.every(w=>hay.includes(w));
    const tagged=items.filter(a=>{const p=a.productId&&prodById(a.productId)||{};
      return hit([a.tag,a.name,a.category,a.location,a.serial,a.notes,a.brand,a.model,a.status,unitLabel(a.unit),p.name,p.brand,p.model,p.type,p.vendor,p.colour,p.category].join(" ").toLowerCase())})
      .sort((x,y)=>x.tag.localeCompare(y.tag,undefined,{numeric:true}));
    const prods=S.cat.products.filter(p=>p.active&&hit([p.id,p.name,p.category,p.type,p.brand,p.model,p.colour,p.vendor,p.description].join(" ").toLowerCase()));
    S.searchRes={tagged,prods};renderView();
  }).catch(e=>{fail(e)});
}

$("#scanForm").onsubmit=async e=>{e.preventDefault();const raw=$("#scanInput").value.trim();if(!raw) return;
